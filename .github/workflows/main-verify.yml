          bash scripts/test_resume_file_safety.bash

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # notify (on failure only): a red main-verify must be LOUD. Upserts a STABLE-TITLE dedup tracking
  # issue -- ONE open issue titled "main-verify: post-merge verification failing" per red streak;
  # each subsequent failing SHA COMMENTS on it instead of opening a new issue (the old per-SHA title
  # filed one issue per failing push -- six in the 2026-07-31..08-01 streak, ml#883/#884/#891/#892/
  # #896/#897). NOT auto-closed on green (the owner closes it after adjudication). Dedup binds to
  # the workflow's own AUTHORSHIP (creator=github-actions[bot] + exact title), never title alone --
  # a pre-created look-alike issue can neither capture nor suppress the tracker (#928 review). Also
  # posts a non-blocking Slack summary (verbatim release-train.yml pattern: a missing
  # SLACK_WEBHOOK_URL skips the step; a post failure never fails the run).
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [symbol-screen, battery]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Upsert tracking issue (stable title, one per red streak)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: "main-verify: post-merge verification failing"
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYMBOL_RESULT: ${{ needs.symbol-screen.result }}
          BATTERY_RESULT: ${{ needs.battery.result }}
        run: |
          set -uo pipefail
          # STABLE-TITLE dedup (replaces the old per-SHA title): a single OPEN issue tracks a whole
          # red streak. The first failure opens it; every subsequent failing SHA COMMENTS on it, so
          # one streak == one issue (the old per-SHA title filed six issues in the 2026-07-31..08-01
          # streak).
          #
          # TRUST BOUNDARY (#928 review): a stable title is a public, forgeable string -- on this
          # public repo any third party can pre-create an OPEN issue with the exact title and
          # capture the tracker (suppressing the bot-owned issue on create; diverting streak
          # comments on update). The match therefore binds to the workflow's own identity: REST
          # creator=github-actions[bot] (unforgeable authorship) + exact-title narrow +
          # .pull_request == null (the /issues surface includes PRs). The bot-applied `main-verify`
          # label below is defense-in-depth for operator filtering only -- deliberately NOT part of
          # this match, so a failed label application can never fork a streak into duplicates.
          existing="$(gh api "repos/${REPO}/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" --jq 'map(select(.pull_request == null) | select(.title == env.TITLE)) | .[0].number // empty' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            # subsequent failure in the streak: comment the new failing SHA + run URL on the issue.
            {
              echo "Still failing at \`${SHA}\`."
              echo ""
              echo "| job | result |"
              echo "|---|---|"
              echo "| symbol-screen (symbol + docs loss) | ${SYMBOL_RESULT} |"
              echo "| battery (regression suite) | ${BATTERY_RESULT} |"
              echo ""
              echo "- Run: ${RUN_URL}"
            } > issue-comment.md
            echo "Commenting new failing SHA on existing tracking issue #${existing}"
            gh issue comment "$existing" --repo "$REPO" --body-file issue-comment.md
          else
            # first failure of the streak: open the single stable-title tracking issue.
            {
              echo "Post-merge **main-verify** is failing on \`main\`."
              echo ""
              echo "First observed failing at \`${SHA}\`."
              echo ""
              echo "| job | result |"
              echo "|---|---|"
              echo "| symbol-screen (symbol + docs loss) | ${SYMBOL_RESULT} |"
              echo "| battery (regression suite) | ${BATTERY_RESULT} |"
              echo ""
              echo "This is the bypass-proof post-merge net (P2 G3): a compositional loss or"
              echo "regression landed on main. Inspect the **sequence-safety-report** artifact"
              echo "(symbol-report.json / docs-report.json) and the battery job log. Subsequent"
              echo "failures in this streak are appended here as comments:"
              echo ""
              echo "- First run: ${RUN_URL}"
              echo ""
              echo "**Remediation:** adjudicate each finding with the census technique; waive a"
              echo "genuinely intentional symbol removal with an \`Allow-Symbol-Loss\` commit trailer"
              echo "(an intentional docs rewrite with \`Allow-Docs-Rewrite\`), per"
              echo "notes/JUNIPER_2026-07-28_JUNIPER-ML_CURSOR-PR-FLOOD-REMEDIATION-ANALYSIS.md."
              echo ""
              echo "_Auto-filed by .github/workflows/main-verify.yml. One issue per red streak; the"
              echo "owner closes it after adjudication (NOT auto-closed on green)._"
            } > issue-body.md
            echo "Opening the stable-title tracking issue"
            # Bot-applied `main-verify` label: ensure it exists (idempotent, never clobbers owner
            # customization -- no --force), open the issue, then best-effort apply. The label is
            # operator filtering / defense-in-depth, never part of the dedup match above -- but a
            # failed CREATE must still fail this step loudly (the tracker is the point of notify).
            gh label create main-verify --repo "$REPO" --description "Auto-filed by the main-verify post-merge net (P2 G3)" --color B60205 2>/dev/null || true
            if new_url="$(gh issue create --repo "$REPO" --title "$TITLE" --body-file issue-body.md)"; then
              gh issue edit "${new_url##*/}" --repo "$REPO" --add-label main-verify 2>/dev/null || true
            else
              echo "::error::failed to open the stable-title tracking issue"
              exit 1
            fi
          fi

      - name: Slack notification (non-blocking)
        # Verbatim reuse of release-train.yml's non-blocking pattern: a missing secret
        # skips the step, and a post failure never fails the run (continue-on-error).
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          SYMBOL_RESULT: ${{ needs.symbol-screen.result }}
          BATTERY_RESULT: ${{ needs.battery.result }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL secret not set -- skipping Slack notification (non-blocking by design)."
            exit 0
          fi
          python - <<'PY' > slack-payload.json
          import json
          import os

          run_url = os.environ["RUN_URL"]
          sha = os.environ["SHA"]
          sym = os.environ.get("SYMBOL_RESULT", "?")
          bat = os.environ.get("BATTERY_RESULT", "?")
          text = f"main-verify FAILED on main at {sha[:12]} -- symbol-screen: {sym}, battery: {bat}. Post-merge compositional-loss / regression net (P2 G3). Run: {run_url}"
          print(json.dumps({"text": text}))
          PY
          curl -fsS -X POST -H 'Content-Type: application/json' -d @slack-payload.json "$SLACK_WEBHOOK_URL" > /dev/null
          echo "Slack notification posted."
