---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-ml
# File Name:     main-verify.yml
# Author:        Paul Calnon
# Version:       0.4.0
#
# Date Created:  2026-07-28
# Last Modified: 2026-08-23
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    Post-merge main-verification workflow (Proposal P2 gate G3; flood-remediation
#    analysis notes/JUNIPER_2026-07-28_JUNIPER-ML_CURSOR-PR-FLOOD-REMEDIATION-ANALYSIS.md
#    S3 / S4 item 8). Runs AFTER a merge lands on main, so it fires no matter who merged
#    or what they bypassed -- the only gate the always-bypass actors (the owner + the
#    Cursor App) cannot skip. This is the bypass-proof compositional-loss net: the flood
#    damage was every-PR-green but serial same-file merges fused / deleted sibling
#    content, and a deleted test cannot fail, so nothing per-PR saw it.
#
#    Three jobs:
#      * symbol-screen -- ALWAYS runs. AST symbol-loss screen + docs deletion-magnitude
#        screen of BASE .. <merge>, both via the juniper-ci-tools console scripts
#        (juniper-symbol-loss-check / juniper-docs-additions-check). Uploads the JSON reports
#        as an artifact a supervisor can consume. FAILs the job on a compositional-loss
#        finding.
#          G3.1 CATCH-UP BASE (flood §4 item 8 / the 2026-07-30 skip incident): a quoted
#          `[skip ci]` in three merge-commit bodies skipped main-verify entirely on
#          ml#870/#872/#873, so those windows were never screened. BASE therefore reaches
#          back to the last tip KNOWN SCREENED, so the NEXT run sweeps every skipped merge
#          in between. The property BASE needs is COVERAGE, never cleanliness: it ratchets
#          on SCREENED, not on GREEN (2026-08-23). Tiers, in order: the newest completed
#          run whose `Assert screens reached a verdict` step succeeded (a FINDING is a
#          verdict and advances the base; only an exit->=2 INVOCATION error does not);
#          else the legacy last-SUCCESSFUL tip; else github.event.before (the push's first
#          parent); else HEAD^1. The chosen base + reason go to the step summary.
#          Resolving this from run-level `status=success` was the mechanism behind a
#          recurring red main -- a finding froze the base, so every later merge re-screened
#          the same window and failed on someone else's damage, each red guaranteeing the
#          next; an unrelated `Regression Battery` failure froze it too (ml#1059). Design:
#          notes/JUNIPER_2026-08-23_JUNIPER-ML_MAIN-VERIFY-CATCHUP-BASE-SCREENED-NOT-GREEN-DESIGN.md
#      * battery -- the full enumerated unittest battery, path-gated: it runs only when
#        the push touched tests/ | util/ | scripts/ | .github/ | pyproject.toml (a
#        docs-only merge skips it). A regression that a bad merge introduced is caught
#        here at the first bad tip.
#      * notify -- needs both; on failure it upserts a dedup tracking issue and posts a
#        non-blocking Slack summary, so a red main-verify is LOUD (the 2026-06-06
#        startup-failure class: main went red unnoticed because merged PRs showed green).
#
# Concurrency (grounded design requirement, P2 S3):
#    ci.yml uses group: ci-${{ github.ref }} + cancel-in-progress: true, and for main
#    pushes github.ref is constant (refs/heads/main), so rapid serial merges CANCEL each
#    other and only the last merge is verified. G3 MUST use a per-SHA group with
#    cancel-in-progress: false so EVERY merge is verified during a storm (delayed by the
#    runner cap, never dropped).
#
# Security Notes:
#    - Runs on push:main + manual dispatch only (never on forks / PRs).
#    - Workflow-level permissions are 'contents: read'; only the notify job elevates
#      (job-level 'issues: write') and only to upsert the tracking issue (R7 pattern).
#    - The notify dedup matches ONLY issues AUTHORED by github-actions[bot] (REST creator=
#      binding + exact-title narrow + .pull_request == null); an issue TITLE is never a
#      trust boundary -- on a public repo anyone can pre-create the stable title (#928).
#    - The one repo secret consumed is SLACK_WEBHOOK_URL (non-blocking notify; a missing
#      secret skips the step and a post failure never fails the run).
#
# References:
#    - notes/JUNIPER_2026-07-28_JUNIPER-ML_CURSOR-PR-FLOOD-REMEDIATION-ANALYSIS.md (S3 P2 G3 / S4 item 8)
#    - juniper-ci-tools (PyPI >=0.8.0): symbol_loss_check / docs_additions_check modules + CLIs (tests in juniper-ci-tools/tests/)
#    - .github/workflows/release-train.yml (the verbatim non-blocking Slack pattern reused below)
#####################################################################################################################################################################################################

name: Post-Merge Main Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Per-SHA, no-cancel: EVERY merge to main is verified even during a merge storm (P2 S3).
# Contrast ci.yml (group: ci-${{ github.ref }} + cancel-in-progress: true), where serial
# main pushes cancel each other so only the last merge's run survives.
concurrency:
  group: main-verify-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_TEST_VERSION: "3.12"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # symbol-screen (ALWAYS runs): the bypass-proof compositional-loss net -- AST symbol-loss
  # screen + docs deletion-magnitude screen of <merge>^1 .. <merge>. Seconds to run (AST + git).
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  symbol-screen:
    name: Symbol & Docs Screen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # G3.1: gh api reads recent runs + their job steps for the screened catch-up base
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need <merge>^1 (github.event.before) AND the new tip -> full history.
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Install sequence-safety screens (juniper-ci-tools)
        run: |
          # G3 post-merge screens now ship as the PyPI package juniper-ci-tools (>=0.8.0),
          # replacing the deleted in-repo util/sequence_safety/ copy (rollout W3). The console
          # scripts juniper-symbol-loss-check / juniper-docs-additions-check land on PATH.
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.8.0,<0.9.0"

      - name: Resolve catch-up base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # G3.1 catch-up base (flood §4 item 8 / the 2026-07-30 skip incident, ml#870/#872/#873):
          # a quoted `[skip ci]` in a merge-commit body skips THIS workflow entirely, so a window
          # of merges can land un-screened. BASE therefore reaches back to the last tip we KNOW
          # was screened, so the next run sweeps every merge skipped in between.
          #
          # The property BASE needs is COVERAGE -- "where does the un-screened region begin?" --
          # never "where were we last clean". Resolving it from run-level `status=success`
          # conflated the two and was the mechanism behind a recurring red main (4 occurrences,
          # 2026-08-12 .. 2026-08-21): a screen finding left the base pinned, so every later merge
          # re-screened the same window and failed on someone else's damage, each red guaranteeing
          # the next. A `Regression Battery` failure pinned it too, for no sequence-safety reason
          # at all (ml#1059). Design of record:
          # notes/JUNIPER_2026-08-23_JUNIPER-ML_MAIN-VERIFY-CATCHUP-BASE-SCREENED-NOT-GREEN-DESIGN.md
          #
          # TIER 1 (screened): newest completed run whose `Symbol & Docs Screen` job reached a
          # VERDICT -- clean or not -- observed as the conclusion of its `Assert screens reached a
          # verdict` step. That step exits non-zero ONLY on a screen INVOCATION error (exit >=2),
          # where no verdict exists and the window genuinely is un-screened; a finding (exit 1) is
          # a verdict and MUST advance the base. Ancestry is checked inside the walk, so a run on
          # a force-pushed or concurrent-descendant tip is skipped rather than abandoning catch-up.
          #
          # !! The step name below is LOAD-BEARING. Rename it and tier 1 matches nothing, the
          # !! resolver falls silently through to tier 2, and the defect returns with no error
          # !! anywhere. Pinned from both sides by tests/test_main_verify_catchup_base.py.
          SCREEN_JOB="Symbol & Docs Screen"
          VERDICT_STEP="Assert screens reached a verdict"
          SCAN_LIMIT=20
          screened=""
          runs="$(gh api "repos/${REPO}/actions/workflows/main-verify.yml/runs?status=completed&branch=main&per_page=${SCAN_LIMIT}" --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' 2>/dev/null || true)"
          while read -r run_id run_sha; do
            [ -n "${run_id:-}" ] && [ -n "${run_sha:-}" ] || continue
            [ "$run_sha" != "null" ] || continue
            # Skip this very push, and anything not usable as a base for THIS head.
            [ "$run_sha" != "$HEAD_SHA" ] || continue
            git rev-parse --verify -q "${run_sha}^{commit}" >/dev/null 2>&1 || continue
            git merge-base --is-ancestor "$run_sha" "$HEAD_SHA" 2>/dev/null || continue
            verdict="$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs" --jq "[.jobs[] | select(.name == \"${SCREEN_JOB}\") | .steps[]? | select(.name == \"${VERDICT_STEP}\") | .conclusion] | first // \"\"" 2>/dev/null || true)"
            if [ "$verdict" = "success" ]; then
              screened="$run_sha"
              break
            fi
          done <<< "$runs"
          # TIER 2 (legacy success): the pre-2026-08-23 single-shot query. Kept for the TRANSITION
          # -- no historical run carries the tier-1 step name, so without this the first run after
          # the change would not sweep -- and as a sound, merely conservative, degradation path if
          # the jobs API is unavailable. A run that SUCCEEDED necessarily reached a verdict, so
          # going forward tier 1 subsumes this and it can never select a NEWER base than tier 1.
          last_ok="$(gh api "repos/${REPO}/actions/workflows/main-verify.yml/runs?status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)"
          base=""
          reason=""
          if [ -n "$screened" ]; then
            n="$(git rev-list --count "${screened}..${HEAD_SHA}" 2>/dev/null || echo '?')"
            base="$screened"
            reason="screened-tip catch-up from ${screened} (${n} commits)"
          elif [ -n "$last_ok" ] && [ "$last_ok" != "null" ] \
              && git rev-parse --verify -q "${last_ok}^{commit}" >/dev/null 2>&1 \
              && [ "$last_ok" != "$HEAD_SHA" ] \
              && git merge-base --is-ancestor "$last_ok" "$HEAD_SHA" 2>/dev/null; then
            n="$(git rev-list --count "${last_ok}..${HEAD_SHA}" 2>/dev/null || echo '?')"
            base="$last_ok"
            reason="catch-up from ${last_ok} (${n} commits)"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git rev-parse --verify -q "${BEFORE}^{commit}" >/dev/null 2>&1; then
            base="$BEFORE"
            reason="event.before (${BEFORE})"
          else
            base="$(git rev-parse --verify -q 'HEAD^1' || git rev-parse HEAD)"
            reason="HEAD^1 fallback (force-push / initial / dispatch)"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "Post-merge screen base: ${reason}"
          {
            echo "### Post-merge sequence-safety base (G3.1 catch-up)"
            echo ""
            echo "- HEAD: \`${HEAD_SHA}\`"
            echo "- BASE: \`${base}\`"
            echo "- reason: ${reason}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── The screens run here; the two ASSERT steps below adjudicate them ──────────────────────
      # Split into three steps deliberately (2026-08-23). This step now RECORDS the screen exit
      # codes instead of failing on them, so that "did this run screen its window?" and "was the
      # verdict clean?" become two INDEPENDENTLY QUERYABLE step conclusions. The catch-up-base
      # resolver above reads the first and must not see the second. Collapsing these back into one
      # step re-introduces the recurring-red defect. Design of record:
      # notes/JUNIPER_2026-08-23_JUNIPER-ML_MAIN-VERIFY-CATCHUP-BASE-SCREENED-NOT-GREEN-DESIGN.md
      - name: Run sequence-safety screens (symbol + docs)
        id: screens
        env:
          BASE_REF: ${{ steps.base.outputs.base }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          set +e  # this step handles screen exit codes manually
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Post-Merge Sequence-Safety Screens      ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # BASE is resolved by the preceding "Resolve catch-up base" step (G3.1): the last tip
          # KNOWN SCREENED when it is an ancestor of HEAD (sweeping any [skip ci]-skipped window),
          # else the last successful tip, else github.event.before, else HEAD^1. Defensive
          # re-fallback here in case the step output is empty/unresolvable.
          base="$BASE_REF"
          if [ -z "$base" ] || ! git rev-parse --verify -q "${base}^{commit}" >/dev/null 2>&1; then
            base="$(git rev-parse --verify -q 'HEAD^1' || git rev-parse HEAD)"
            echo "BASE output empty/unresolvable -> fallback = ${base}"
          fi
          echo "Screening ${base} .. ${HEAD_SHA}"
          echo ""
          echo "--- symbol-loss screen ---"
          # Human run to the log carries the authoritative exit code; the guarded
          # --json run then writes the artifact (same verdicts, machine-readable).
          # Explicit --scope globs reproduce ml's historical in_scope() predicate
          # (top-level tests/*.py + util/**/*.py + util/**/*.bash) verbatim (rollout W3).
          juniper-symbol-loss-check --scope 'tests/*.py' --scope 'util/**/*.py' --scope 'util/**/*.bash' --base "$base" --head "$HEAD_SHA"
          src=$?
          juniper-symbol-loss-check --scope 'tests/*.py' --scope 'util/**/*.py' --scope 'util/**/*.bash' --base "$base" --head "$HEAD_SHA" --json > symbol-report.json || true
          echo ""
          echo "--- docs deletion-magnitude screen ---"
          # No --scope: the universal docs cluster (AGENTS.md + docs/**/*.md + notes/**/*.md)
          # is the package default and matches ml's historical in_docs_scope() verbatim.
          juniper-docs-additions-check --base "$base" --head "$HEAD_SHA"
          drc=$?
          juniper-docs-additions-check --base "$base" --head "$HEAD_SHA" --json > docs-report.json || true
          echo ""
          echo "symbol screen exit=${src} ; docs screen exit=${drc}"
          # Publish the exit codes for the two assert steps. This step deliberately does NOT fail
          # on a finding -- if it did, the coverage step below would be SKIPPED on exactly the runs
          # whose windows most need to be marked screened.
          echo "src=${src}" >> "$GITHUB_OUTPUT"
          echo "drc=${drc}" >> "$GITHUB_OUTPUT"
          exit 0

      # ── G3.1 COVERAGE SIGNAL ──────────────────────────────────────────────────────────────────
      # !! LOAD-BEARING STEP NAME. The `Resolve catch-up base` step queries this step's conclusion
      # !! through the jobs API to decide whether a run screened its window. Renaming it does not
      # !! fail anything -- it silently drops the resolver to the legacy tier and restores the
      # !! recurring-red defect. Pinned from both sides by tests/test_main_verify_catchup_base.py.
      #
      # Fails ONLY on a screen INVOCATION error (exit >=2), where no verdict exists and the window
      # is genuinely un-screened. A compositional-loss FINDING (exit 1) is a verdict: the window
      # WAS screened, so this step passes and the base is free to advance past it. If the screens
      # step above died outright, this step is `skipped` -- which is not `success`, so no false
      # coverage is ever claimed.
      - name: Assert screens reached a verdict
        env:
          SRC: ${{ steps.screens.outputs.src }}
          DRC: ${{ steps.screens.outputs.drc }}
        run: |
          set -uo pipefail
          # Absent outputs are treated as an invocation error, never as coverage.
          src="${SRC:-99}"
          drc="${DRC:-99}"
          if [ "${src}" -ge 2 ] || [ "${drc}" -ge 2 ]; then
            echo "::error::sequence-safety screen invocation error (symbol=${src} docs=${drc}) -- window NOT screened; the G3.1 catch-up base will NOT advance past this run"
            exit 2
          fi
          echo "::notice::sequence-safety screens reached a verdict (symbol=${src} docs=${drc}) -- this window IS screened"

      # ── VERDICT SIGNAL ────────────────────────────────────────────────────────────────────────
      # The job's red/green. Unchanged in effect: a finding still fails the job, the run, and fires
      # `Notify on Failure`. Only the SHAPE of the failure moved -- from one failing step to a
      # passing coverage step plus this one.
      - name: Assert screens clean
        env:
          SRC: ${{ steps.screens.outputs.src }}
          DRC: ${{ steps.screens.outputs.drc }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          src="${SRC:-99}"
          drc="${DRC:-99}"
          if [ "${src}" -ge 1 ] || [ "${drc}" -ge 1 ]; then
            echo "::error::post-merge compositional-loss finding(s) at ${HEAD_SHA} -- see the screens above and the sequence-safety-report artifact"
            exit 1
          fi
          echo "::notice::sequence-safety screens clean at ${HEAD_SHA}"

      - name: Upload sequence-safety report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sequence-safety-report
          path: |
            symbol-report.json
            docs-report.json
          if-no-files-found: warn
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # battery (path-gated): the full enumerated unittest battery re-run against the merged tip, so a
  # regression a bad merge introduced is caught at the first bad main tip. Runs only when the push
  # touched tests/ | util/ | scripts/ | .github/ | pyproject.toml -- a docs-only merge skips it
  # (the symbol-screen job still always runs). SYNC NOTE: the battery list below MUST stay in sync
  # with ci.yml's `tests` job enumeration (there is no pytest auto-discovery); any test added to /
  # removed from ci.yml must be mirrored here in the same PR.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  battery:
    name: Regression Battery
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect relevant path changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          set +e
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify -q "${base}^{commit}" >/dev/null 2>&1; then
            base="$(git rev-parse --verify -q 'HEAD^1' || true)"
          fi
          if [ -z "$base" ]; then
            echo "No resolvable base (initial / force push) -> running the battery to be safe."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "Changed files ${base}..${HEAD_SHA}:"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(tests/|util/|scripts/|\.github/|pyproject\.toml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Relevant code/config/test paths changed -> running the battery."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No tests/ | util/ | scripts/ | .github/ | pyproject.toml changes -> skipping the battery (P2 S3 burst-cost mitigation)."
          fi

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Install test dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          # Same installs ci.yml's tests job performs: PyYAML (workflow/registry
          # parsers) + packaging (env-drift dogfood's SpecifierSet/Version) +
          # juniper-ci-tools (the sequence-safety console scripts that
          # tests/test_predict_merge.py shells to end-to-end; rollout W3).
          pip install "pyyaml>=6.0" "packaging>=22.0"
          pip install "juniper-ci-tools>=0.8.0,<0.9.0"

      - name: Run Python regression battery
        if: steps.changes.outputs.run == 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Post-Merge Regression Battery          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # MIRROR of ci.yml's `tests` job list (keep in sync -- no auto-discovery).
          python3 -m unittest -v tests/test_wake_the_claude.py
          python3 -m unittest -v tests/test_claude_interactive.py
          python3 -m unittest -v tests/test_env_repr_safety.py
          python3 -m unittest -v tests/test_worktree_cleanup.py
          python3 -m unittest -v tests/test_worktree_activate.py
          python3 -m unittest -v tests/test_worktree_sweep_scripts.py
          python3 -m unittest -v tests/test_yubikey_test_pinentry.py
          python3 -m unittest -v tests/test_cleanup_session_worktrees.py
          python3 -m unittest -v tests/test_cleanup_open_remove_stale_worktrees.py
          python3 -m unittest -v tests/test_worktree_wipeout_close.py
          python3 -m unittest -v tests/test_global_text_search.py
          python3 -m unittest -v tests/test_prune_git_branches_without_working_dirs.py
          python3 -m unittest -v tests/test_reap_pytest_orphans.py
          python3 -m unittest -v tests/test_kill_helpers.py
          python3 -m unittest -v tests/test_duplicati_scheduled_backup.py
          python3 -m unittest -v tests/test_editable_install_drift_check.py
          python3 -m unittest -v tests/test_env_floor_drift_check.py
          python3 -m unittest -v tests/test_env_drift_check.py
          python3 -m unittest -v tests/test_env_drift_check_drift.py
          python3 -m unittest -v tests/test_release_train_registry.py
          python3 -m unittest -v tests/test_release_train_detect.py
          python3 -m unittest -v tests/test_release_train_propose.py
          python3 -m unittest -v tests/test_release_train_workflow_guard.py
          python3 -m unittest -v tests/test_release_train_archive_guard.py
          python3 -m unittest -v tests/test_release_train_ceremony.py
          python3 -m unittest -v tests/test_prompt_discovery.py
          python3 -m unittest -v tests/test_symbol_overlay.py
          python3 -m unittest -v tests/test_generated_prompt_index.py
          python3 -m unittest -v tests/test_thread_handoff_archive.py
          python3 -m unittest -v tests/test_install_agents.py
          python3 -m unittest -v tests/test_agent_suite_doctor.py
          python3 -m unittest -v tests/test_agent_suite_summary.py
          python3 -m unittest -v tests/test_requirements_drift_check.py
          python3 -m unittest -v tests/test_validate_claude_yaml_access.py
          python3 -m unittest -v tests/test_workflow_script_paths.py
          # ci.yml G4 pre-commit split + sequence-safety label hatch (mirror ci.yml).
          python3 -m unittest -v tests/test_ci_precommit_g4.py
          python3 -m unittest -v tests/test_publish_testpypi_verify.py
          python3 -m unittest -v tests/test_main_verify_battery_paths.py
          python3 -m unittest -v tests/test_ci_quality_gate.py
          python3 -m unittest -v tests/test_publish_subpackage_workflows.py
          # Flood-remediation sequence-safety screens (P2 G1/G2) now ship as the PyPI
          # package juniper-ci-tools (>=0.8.0); their unit tests live in juniper-ci-tools/tests/
          # (rollout W3). The label-hatch rehearsal below stays juniper-ml's gate.
          python3 -m unittest -v tests/test_ci_sequence_safety_hatch.py
          python3 -m unittest -v tests/test_main_verify_workflow_guard.py
          # Flood-remediation sequence-safety screens (P2 G1/G2; mirror ci.yml).
          python3 -m unittest -v tests/test_main_verify_catchup_base.py
          python3 -m unittest -v tests/test_main_verify_notify_dedup.py
