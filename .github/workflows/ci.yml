---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-ml
# File Name:     ci.yml
# Author:        Paul Calnon
# Version:       0.4.0
#
# Date Created:  2026-02-23
# Last Modified: 2026-07-30
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions CI/CD Pipeline for juniper-ml meta-package.
#    - Pre-commit hooks for code quality (flake8, bandit, shellcheck, yamllint, markdownlint).
#      G4 changed-files split (flood §4 item 8 phase 2): pull_request / merge_group scope to
#      the event's changed files (--from-ref/--to-ref); push keeps --all-files.
#    - Regression tests (Python unittest + bash scripts)
#    - Sequence Safety (ADVISORY, standalone): per-PR symbol-loss + docs-deletion screens
#      (flood §4 item 8 phase 3); NOT in the Quality Gate needs -- soak-advisory per the
#      codeql convention, with a WARN-only allow-symbol-loss / docs-rewrite label hatch.
#    - Fleet PR Lint (ADVISORY, warnings-only): cursor/* best-practices surface to the step
#      summary (flood §4 item 8 phase 4); never fails, never comments.
#    - Build and validate (twine check)
#    - Documentation link validation
#    - Security scanning (pip-audit)
#    - Dependency documentation generation
#
#####################################################################################################################################################################################################

name: CI/CD Pipeline

on:
  push:
    # Topic-branch globs (feature/**, fix/**) were removed 2026-08-13: once a PR is
    # open, `push` and `pull_request` BOTH fire for the same commit, so every job ran
    # twice. The concurrency group is keyed on github.ref, which differs between a
    # branch push (refs/heads/…) and a PR (refs/pull/N/merge), so cancel-in-progress
    # never collapsed the pair — it was a straight 2x CI cost on every PR from a
    # matching branch. Same fix as juniper-recurrence#108. `pull_request` covers every
    # commit once a PR exists; workflow_dispatch remains for a branch with no PR.
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # merge_group: required so every gating context re-runs on the queued merge
  # commit GitHub builds for the "Require merge queue" ruleset rule (flood-remediation
  # §4 item 1 prerequisite). Without it no required context posts and the queue stalls.
  merge_group:
  workflow_dispatch:

concurrency:
  # Per-SHA group on push so every main merge completes its own run — rapid serial
  # merges must NOT cancel each other, else only the last merge is verified
  # (flood-remediation §4 item 2). pull_request / merge_group / dispatch runs still
  # group by ref and cancel superseded runs of the same ref.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  PYTHON_TEST_VERSION: "3.12"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Pre-commit: Code Quality Checks
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  pre-commit:
    name: Pre-commit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # G4 pre-commit changed-files split (flood-remediation §4 item 8 phase 2): the
          # pull_request / merge_group runs scope pre-commit to the event's changed files via
          # `--from-ref <BASE> --to-ref HEAD`, which needs the BASE commit present in the
          # checkout -> full history. (push keeps `--all-files`, which needs no base.)
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Run pre-commit hooks
        # G4 pre-commit changed-files split (flood-remediation §4 item 8 phase 2 / Proposal
        # P2 §4). On pull_request / merge_group, scope pre-commit to the event's changed files
        # (`--from-ref <BASE> --to-ref HEAD`) so a union-non-clean main (two individually
        # black-clean branches whose merge is not black-clean) no longer paints EVERY open PR
        # red until a manual re-push (#759). On push (incl. main) keep `--all-files`: the global
        # union check that catches union-dirt at the point it lands, reinforced UNBYPASSABLY
        # post-merge by G3 (main-verify.yml also runs `pre-commit run --all-files`). The 3
        # required context names -- `Pre-commit (Python 3.1x)` -- are unchanged, so this is a
        # drop-in swap for the branch ruleset.
        #
        # Caveats (Proposal P2 §4):
        #   * `pass_filenames: false` hooks (the juniper-check-doc-links local hook,
        #     .pre-commit-config.yaml:234-263) still run GLOBALLY under `--from-ref` mode --
        #     intended: doc-link integrity is a whole-repo property, not a changed-files one.
        #   * changed-files-only is BLIND to a union effect in a file the PR did NOT touch
        #     (a formatting conflict two unrelated branches create in an untouched file); that
        #     residual is exactly what G3's post-merge `--all-files` (+ the G1 merge-ref symbol
        #     screen) then cover, so the split loses nothing net while removing the blast radius.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Pre-commit Checks                       ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE_SHA"; else base="$MG_BASE_SHA"; fi
            echo "Changed-files scope (${EVENT_NAME}): pre-commit run --from-ref ${base} --to-ref HEAD"
            # fetch-depth:0 already holds the base (it is an ancestor of the merge ref); fetch
            # defensively in case the event base is not yet local.
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$base" || true
            fi
            pre-commit run --from-ref "$base" --to-ref HEAD --show-diff-on-failure
          else
            echo "Full-tree scope (${EVENT_NAME}): pre-commit run --all-files"
            pre-commit run --all-files --show-diff-on-failure
          fi

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Tests: Run regression tests for scripts and tooling
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  tests:
    name: Regression Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [pre-commit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          # PyYAML is required by tests/test_workflow_script_paths.py which
          # parses .github/workflows/*.yml.
          pip install "pyyaml>=6.0"
          # packaging is required by tests/test_env_drift_check.py, which
          # dogfoods the juniper-ci-tools env-floor-drift console script as a
          # subprocess (the module imports packaging for SpecifierSet/Version).
          pip install "packaging>=22.0"
          # juniper-ci-tools ships the sequence-safety console scripts
          # (juniper-symbol-loss-check / juniper-docs-additions-check) that
          # tests/test_predict_merge.py shells to end-to-end in its behavioral
          # screen arms (rollout W3; the in-repo util/sequence_safety/ copy was
          # deleted). Without it those arms would degrade to `skip`.
          pip install "juniper-ci-tools>=0.8.0,<0.9.0"
          # numpy is required by tests/test_run_experiment.py: the experiment
          # driver writes decision_boundary.npz and the tests round-trip it
          # via numpy.load (the driver itself imports numpy lazily).
          pip install "numpy>=1.26"
          # matplotlib is required by tests/test_run_experiment.py's SS8.1
          # plot arms (util/experiments/plots_cascor.py renders on the Agg
          # backend; the driver loads it lazily only when outputs.plots
          # requests something).
          pip install "matplotlib>=3.8"
          # h5py is required by the two snapshot suites below. Both are hermetic
          # -- they build HDF5 fixtures directly and never touch the real ~27.9k
          # archive -- but the modules under test import h5py at module scope, so
          # without it the suites cannot even be collected. Wheels exist for the
          # whole 3.12/3.13/3.14 matrix, so this never builds from source.
          pip install "h5py>=3.11"

      - name: Run Python regression tests
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Python Regression Tests                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python3 -m unittest -v tests/test_wake_the_claude.py
          # claude_interactive.bash (`claudey`): DEBUG-forced
          # --dangerously-skip-permissions + inverted TRUE/FALSE opt-in
          # convention vs the older default_interactive launcher.
          python3 -m unittest -v tests/test_claude_interactive.py
          # Env-repr safety: lint gate forbidding raw os.environ-derived
          # subprocess env mappings in tests/ (secret-leak class; the
          # RedactedEnv wrapper in tests/redacted_env.py is the fix).
          python3 -m unittest -v tests/test_env_repr_safety.py
          # The doc-link validator regression tests were moved out of this
          # repo in Wave 4 of the doc-link migration; coverage now lives
          # in juniper-doc-tools/tests/, exercised by the dedicated
          # `CI -- juniper-doc-tools` workflow.
          python3 -m unittest -v tests/test_worktree_cleanup.py
          python3 -m unittest -v tests/test_worktree_activate.py
          python3 -m unittest -v tests/test_worktree_sweep_scripts.py
          # tests/test_yubikey_test_pinentry.py: Assuan OK greeting/BYE + GETPIN
          # class routing for util/ad-hoc/2026-08-03_yubikey_test_pinentry.bash
          # (#914 regression: non-OK greeting -> gpg-agent "No pinentry").
          # util/ad-hoc is not pre-commit-lint-gated; this unittest is the gate.
          python3 -m unittest -v tests/test_yubikey_test_pinentry.py
          # tests/test_cleanup_session_worktrees.py: hermetic coverage for
          # scripts/cleanup_session_worktrees.py — _has_merged_pr fail-closed
          # (gh fail / bad JSON), dirty/unmerged/detached keeps, self-cwd skip,
          # and --dry-run remove of main-ancestor / MERGED-PR clean tips.
          # Distinct from util/worktree_cleanup.bash (V2 orchestrator).
          python3 -m unittest -v tests/test_cleanup_session_worktrees.py
          # util/cleanup_open_worktrees.bash + util/remove_stale_worktrees.bash:
          # destructive path-filter / skip-missing-.claude gates. Hermetic fixture
          # repos only; util/ is not pre-commit-gated so this unittest is the gate.
          python3 -m unittest -v tests/test_cleanup_open_remove_stale_worktrees.py
          # tests/test_worktree_wipeout_close.py: pre-destroy gates for
          # util/worktree_wipeout.bash (missing→1 / invalid→2) and
          # util/worktree_close.bash (not-found vs matched remove). Hermetic
          # tempfile git fixtures; util/ is not pre-commit-lint-gated.
          python3 -m unittest -v tests/test_worktree_wipeout_close.py
          python3 -m unittest -v tests/test_global_text_search.py
          # tests/test_prune_git_branches_without_working_dirs.py: destructive
          # fix/* branch prune when inferred .claude/ tree dir is missing
          # (util/prune_git_branches_without_working_dirs.bash). Hermetic temp
          # repo only; util/ is not pre-commit-lint-gated.
          python3 -m unittest -v tests/test_prune_git_branches_without_working_dirs.py
          python3 -m unittest -v tests/test_reap_pytest_orphans.py
          # tests/test_kill_helpers.py: hermetic process-filter / kill-path coverage for
          # util/kill_all_pythons.bash and util/juniper_worker_kill.bash (PATH-stubbed
          # ps/sudo/kill; bash kill builtin disabled). util/ is not pre-commit-lint-gated.
          python3 -m unittest -v tests/test_kill_helpers.py
          python3 -m unittest -v tests/test_editable_install_drift_check.py
          # tests/test_env_floor_drift_check.py: gap-I-2 floor-drift checker --
          # installed juniper-* (dist-info METADATA) vs the target repo's pyproject
          # floors. Structural gate only (ubuntu CI has no conda env); a real-env
          # scan is a documented manual-verify step. util/ is not pre-commit-gated.
          python3 -m unittest -v tests/test_env_floor_drift_check.py
          # tests/test_env_drift_check.py: dogfoods the SHARED juniper-ci-tools
          # env-floor-drift console script (juniper-env-drift-check, plan §10.1) end
          # to end against synthetic site-packages + pyproject + requirements.lock
          # fixtures -- exit codes (0 ok / 1 drift / 2 usage), the plain-wheel ==
          # editable equivalence, and --check-lock. juniper-ci-tools/ is outside this
          # repo's flake8/pre-commit scope, so this unittest is the integration gate.
          python3 -m unittest -v tests/test_env_drift_check.py
          # tests/test_env_drift_check_drift.py: STRUCTURAL gate for the
          # juniper-env-drift-check console-script ENTRY POINT (the 0.5.0 #580
          # clobber regression) + a class guard that every juniper_ci_tools/cli*.py
          # has a [project.scripts] entry. Runs in this always-on pytest job because
          # the build-smoke alone missed the 0.5.0 drop. Stdlib only.
          python3 -m unittest -v tests/test_env_drift_check_drift.py
          # tests/test_release_train_registry.py: structural lint + registry<->pyproject
          # drift gate for util/release_train/registry.yaml (PyPI release-train plan
          # §4.1). Always-on structural checks (18 packages, 8 repos incl. recurrence,
          # required fields/enums); the 7 in-repo juniper-ml packages resolve
          # unconditionally, cross-repo entries auto-skip (doc-tools sibling semantics).
          python3 -m unittest -v tests/test_release_train_registry.py
          # tests/test_release_train_detect.py: hermetic tests for the release-train
          # detection engine (util/release_train/detect.py, plan §4.2/4.3) -- every
          # classification, static/dynamic version reads, tag resolution, the
          # substantive-hunk filter, path-scoping, SemVer, manifest shape, exit codes.
          # No network / no real gh / no real pip (all sources injected). util/ is not
          # pre-commit-lint-gated, so this unittest is the gate.
          python3 -m unittest -v tests/test_release_train_detect.py
          # tests/test_release_train_propose.py: hermetic tests for the Phase 2.1 proposal-PR
          # generator (util/release_train/propose.py + notes_render.py, plan §5.4/§6/§10.1) --
          # a well-formed dry-run for a static + a dynamic package, the CHANGELOG [Unreleased]
          # move, template-driven notes + archive-name convention, the gh-pr-list dup-guard,
          # the changelog_conflict refusal, and that a dry-run writes nothing. No network / no
          # real gh / no repo writes (all effects injected). util/ is not pre-commit-lint-gated,
          # so this unittest is the gate.
          python3 -m unittest -v tests/test_release_train_propose.py
          # tests/test_release_train_workflow_guard.py: structural R7 privilege-boundary guard for
          # .github/workflows/release-train.yml (plan §9.3 / §12 step 2.2). Asserts workflow-level
          # permissions are contents:read, the propose job's are exactly {contents:write,
          # pull-requests:write}, its `if` gates on the detect mode output (write path unreachable in
          # report mode), and no secret other than SLACK_WEBHOOK_URL is referenced. PyYAML (installed
          # above); the workflow YAML is not otherwise lint-gated for this property.
          python3 -m unittest -v tests/test_release_train_workflow_guard.py
          # tests/test_release_train_archive_guard.py: hermetic tests for the exempt
          # notes-archive structural guard (util/release_train/archive_guard.py, plan
          # §7.2 / §12 step 3.1). Drives the pure four-rule classifier with synthetic
          # `git diff --name-status` change sets + the CLI via the --name-status-file
          # seam against the real registry.yaml: a pure notes-add PASSES, and modify /
          # delete / out-of-path / bad-name / mixed diffs each FAIL; exit codes 0/1/2.
          # No network / git / gh. util/ is not pre-commit-lint-gated, so this is the gate.
          python3 -m unittest -v tests/test_release_train_archive_guard.py
          # tests/test_release_train_ceremony.py: hermetic tests for the exempt-archive
          # + Release ceremony engine (util/release_train/ceremony.py, plan §7/§8/§9.3/§10
          # / §12 step 3.2). Drives the planner + execute over an injected CeremonySources
          # seam: every §8 precondition HALT (main CI red / declared<released anomaly /
          # missing CHANGELOG section / TestPyPI-verify failure), the happy-path exact
          # action sequence, dup-guard/idempotent re-entry, and the R7 gh-surface invariant
          # (§9.3: the live seam issues only {pr create, pr merge --auto, release create,
          # run list/view, issue create/edit} -- nothing environment- or reviewer-mutating).
          # No network / gh / git / repo writes; dry-run is byte-identical. util/ is not
          # pre-commit-lint-gated, so this unittest is the gate.
          python3 -m unittest -v tests/test_release_train_ceremony.py
          # tests/test_prompt_discovery.py: behavioural coverage for the custom-agent
          # suite's discovery helpers (util/prompt_discovery/) -- grounding-bundle schema,
          # provenance envelope, and the test_status cold_cache/empty distinction. util/ is
          # not lint-gated by pre-commit (flake8/black scope to scripts+tests), so this
          # unittest is the gate. Stdlib only (subprocess/tempfile/json).
          python3 -m unittest -v tests/test_prompt_discovery.py
          # tests/test_symbol_overlay.py: deterministic merge for the Serena symbol overlay
          # (util/prompt_discovery/symbol_overlay.py, OQ-8) -- Serena-resolved wins, grep is the
          # fallback, unresolved stays UNRESOLVED, input bundle not mutated. Stdlib only.
          python3 -m unittest -v tests/test_symbol_overlay.py
          # tests/test_generated_prompt_index.py: util/generated_prompt_index.py (P4) -- indexes
          # prompts/generated/ by the emit-name convention + a SAFETY-gated prune/archive (no
          # delete/move without --yes; .gitkeep/non-convention files never touched; dir read from
          # conventions.yaml).
          python3 -m unittest -v tests/test_generated_prompt_index.py
          # tests/test_thread_handoff_archive.py: drift guard for the archived handoff prompt
          # filename convention and top-level note references to archived handoff prompts.
          python3 -m unittest -v tests/test_thread_handoff_archive.py
          # tests/test_install_agents.py: drives util/install_agents.bash (the ~/.claude
          # mirror, PR 6a) against a synthetic source + throwaway target -- idempotent,
          # reversible, dry-run-safe, no-clobber. Stdlib only (subprocess/tempfile).
          python3 -m unittest -v tests/test_install_agents.py
          # tests/test_agent_suite_doctor.py: the suite health-check utility (util/agent_suite_doctor.py)
          # -- a dogfood that consumes every layer (agents/skill/templates/RUBRIC/data-layer/discovery/
          # mirror). Real-repo-healthy + synthetic-missing-component FAIL + --json/--strict/--no-discovery.
          python3 -m unittest -v tests/test_agent_suite_doctor.py
          # tests/test_agent_suite_summary.py: util/agent_suite_summary.py (P3) -- the suite
          # quick-reference; asserts every agent + template appears, --json round-trips, and
          # --markdown rows respect the 512 line-length. Stdlib + PyYAML.
          python3 -m unittest -v tests/test_agent_suite_summary.py
          # tests/test_predict_merge.py: the Stage-0 fleet-supervisor script layer
          # (util/fleet_triage/predict_merge.py) -- hermetic predicted-merge over synthetic
          # bare-origin + branch fixtures: the four verdicts, TRUE-delta discrimination, the
          # cluster map + order, triage_batch soft-ERROR continue, detached-clone-never-
          # mutates-source, and exit codes. util/ is not pre-commit-lint-gated, so this
          # unittest is the gate (flood remediation §4 item 7).
          python3 -m unittest -v tests/test_predict_merge.py
          # tests/test_fleet_supervisor_contract.py: static contract for the read-only
          # fleet-supervisor subagent (.claude/agents/fleet-supervisor.md) -- exact tool set
          # {Read,Grep,Glob,Bash}, opus+max, and body wiring to predict_merge.py + all four
          # verdict tokens + the read-only/never-push + two-key DUP-CLOSE contract.
          python3 -m unittest -v tests/test_fleet_supervisor_contract.py
          # tests/test_pr_budget_alarm.py: YAML-extraction rehearsal for
          # .github/workflows/pr-budget-alarm.yml (flood P1 §5 / #870) -- OK/WARN/ALARM
          # thresholds, empty-var defaults (15/30), gh soft-fail -> level=OK exit 0, and
          # the read-only + Slack continue-on-error surface. Workflow YAML is not otherwise
          # lint-gated for these properties, so this unittest is the gate.
          python3 -m unittest -v tests/test_pr_budget_alarm.py
          # tests/test_requirements_drift_check.py: exercises util/requirements_drift_check.py
          # (the notes/requirements snapshot drift checker; uses the PyYAML installed above).
          # Listed in AGENTS.md's "Run all tests" but never wired into this CI list
          # (audit finding F14) -- added here.
          python3 -m unittest -v tests/test_requirements_drift_check.py
          python3 -m unittest -v tests/test_validate_claude_yaml_access.py
          python3 -m unittest -v tests/test_workflow_script_paths.py
          # tests/test_ci_precommit_g4.py: YAML-extraction rehearsal for ci.yml's
          # G4 pre-commit changed-files split (flood §4 item 8 phase 2 / #759) --
          # pull_request / merge_group must --from-ref <BASE> --to-ref HEAD; push
          # (and other non-PR events) keep --all-files. Workflow YAML is not
          # otherwise lint-gated for this split, so this unittest is the gate.
          python3 -m unittest -v tests/test_ci_precommit_g4.py
          # tests/test_main_verify_workflow_guard.py: structural trust-binding guard for
          # main-verify.yml's notify job (#928 review) -- the stable-title tracking-issue
          # dedup must bind to creator=github-actions[bot] authorship (+ exact title +
          # .pull_request filter; label-free match, bot-applied label on create). A title
          # alone is never a trust boundary on a public repo.
          python3 -m unittest -v tests/test_main_verify_workflow_guard.py
          # tests/test_publish_testpypi_verify.py: structural + hermetic YAML-extraction
          # gate for publish.yml's TestPyPI bare/[clients]/[tools] install verification
          # (extras-resolution ship-silent class + TestPyPI index / no --no-deps contract).
          python3 -m unittest -v tests/test_publish_testpypi_verify.py
          # tests/test_main_verify_battery_paths.py: main-verify.yml battery
          # path-change detector (P2 G3 burst-cost gate) -- util|tests|scripts|
          # .github|pyproject → run; docs/notes-only → skip; unresolvable base →
          # fail-open. YAML-extraction rehearsal IS the gate.
          python3 -m unittest -v tests/test_main_verify_battery_paths.py
          # tests/test_ci_quality_gate.py: Quality Gate needs: must exclude
          # advisory/PR-only jobs (sequence-safety / fleet-pr-lint /
          # release-train-archive-guard); security soft-fails on == failure
          # (skipped OK). Structural + shell rehearsal IS the gate.
          python3 -m unittest -v tests/test_ci_quality_gate.py
          # tests/test_publish_subpackage_workflows.py: structural + hermetic
          # YAML-extraction gate for the six publish-*.yml shared-package workflows
          # (tag-prefix guard, no push:tags #555 race, skip-existing, --no-deps
