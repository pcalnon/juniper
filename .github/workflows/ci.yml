          # (util/check_conda_env_torch.bash exit 0/1/2/3/4) via JUNIPER_CONDA_DIR + stub python.
          # util/ is not pre-commit-lint-gated, so this unittest is the gate.
          python3 -m unittest -v tests/test_check_conda_env_torch.py

      - name: Run bash regression tests
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Bash Regression Tests                   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          bash scripts/test_resume_file_safety.bash

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Release-Train Archive Guard: the exempt notes-archive PR structural guard lane
  # (release-train plan §7.2 / §12 step 3.1). Computes the PR's changed-file set and passes ONLY if
  # the diff is exactly new file(s) under notes/releases/ matching the RELEASE_NOTES_ convention
  # (add-only, path-confined, name-valid, single-purpose). SKIPs (passes) for any PR that does NOT
  # touch notes/releases/, so it never blocks a normal PR. A FAIL merely fails this check -- the PR
  # then falls back to the standard owner gate (plan S7.2); the guard has no side effect. Wired here
  # as a standalone status check so the owner can later mark it REQUIRED in the branch ruleset (step
  # 3.3), which is what lets the exempt archive PR auto-merge behind it.
  #
  # Escape hatch (the #1003 link-repair class): now that the check is REQUIRED, an intentional
  # in-place correction of an already-archived note carries an `Allow-Archive-Edit: <path>` commit
  # trailer (full path / basename / `*`), mirroring the house Allow-Docs-Rewrite / Allow-Symbol-Loss
  # idiom. The trailer text is injected via --trailers-file (below), and a waived-and-otherwise-clean
  # diff reports the distinct WAIVED verdict instead of FAIL. Carry the trailer into the SQUASH
  # commit message when merging -- trailers travel in git history.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  release-train-archive-guard:
    name: Release-Train Archive Guard
    runs-on: ubuntu-latest
    # Runs on pull_request (the real guard) and on merge_group (a queued merge commit
    # must re-post this required context, else the merge queue stalls — flood-remediation
    # §4 item 1). On a branch push github.base_ref is empty, so the job is skipped and
    # never blocks a push (unchanged behaviour; the guard is absent from the Quality Gate
    # needs, so its skip on push does not affect that gate).
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    steps:
      # merge_group short-circuit: this guard validates PR *content*, already checked on
      # the PR run. A queued merge commit has no PR base_ref to diff, so it must simply
      # report this required context green — BEFORE any base-ref diffing. The pull_request
      # path below is byte-for-byte the pre-existing guard (each step gated to pull_request
      # so it is skipped, not altered, on a queue run).
      - name: Report success on merge queue (validation already ran on the PR)
        if: github.event_name == 'merge_group'
        run: |
          echo "::notice::merge_group run — Release-Train Archive Guard already validated on the PR; reporting success without base-ref diffing."

      - name: Checkout Code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need base + head history for the merge-base (three-dot) diff

      - name: Set up Python
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Install guard dependencies
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          # PyYAML: archive_guard.py resolves the valid pypi_names from registry.yaml
          # (via detect.load_registry) for the rule-3 name-valid check.
          pip install "pyyaml>=6.0"

      - name: Run archive guard
        if: github.event_name == 'pull_request'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Release-Train Archive Guard             ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # FETCH_HEAD = the PR base branch tip; the three-dot range then yields exactly the
          # PR's net change set (merge-base(base, HEAD)..HEAD), matching `gh pr diff`.
          git fetch --no-tags origin "${{ github.base_ref }}"
          # Allow-Archive-Edit escape: the guard reads the PR's commit bodies from an INJECTED
          # file (it never shells out to git itself), so the classifier stays pure and hermetically
          # testable. Two-dot FETCH_HEAD..HEAD = exactly the commits this PR adds on top of base
          # (the same range the sequence-safety screens' trailer parser uses); checkout above is
          # fetch-depth: 0, so the full message bodies are present.
          git log --format=%B FETCH_HEAD..HEAD > archive-guard-trailers.txt
          python3 util/release_train/archive_guard.py --base FETCH_HEAD --head HEAD --trailers-file archive-guard-trailers.txt

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Memory Budget (ADVISORY, standalone): P2 of the shared-session-memory plan
  # (notes/JUNIPER_2026-08-18_JUNIPER-ML_SHARED-SESSION-MEMORY-PLAN.md).
  #
  # AGENTS.md grew ~20x in six months WHILE UNDER four active CI gates -- every one of them enforces
  # structure or currency and none enforces size. 172 of 200 main-line merges grew it. This is the
  # ratchet that makes a cut durable, and per correction C1 it ships BEFORE the cut.
  #
  # ADVISORY during the soak: standalone, and deliberately ABSENT from the Quality Gate `needs:` so
  # a skip on push can never fail the gate -- the same pattern Sequence Safety used before it was
  # promoted in the ruleset. Promote this the same way (ruleset), never via the QG `needs:`.
  #
  # STATUS (P4, 2026-08-20). The two steps below are deliberately at DIFFERENT strengths:
  #
  #   Memory File Size Budget  BLOCKING  -- no `--advisory`. Exits 1 on a violation.
  #   Relocation Completeness  advisory  -- keeps `--advisory`.
  #
  # The budget check has no known false-positive class: its no-worsening rule means a PR only
  # fails when it BOTH exceeds the ceiling AND grew the file, so an already-over `main` never
  # blocks unrelated work and a shrinking PR always passes.
  #
  # G3 stays advisory because it DOES have one: it is line-granular, so a removed line whose
  # content is legitimately REDISTRIBUTED across several destination lines scores low and is
  # reported although nothing was lost. Blocking on that would punish correct relocations. The
  # fix would be union/coverage matching, which is how G3 would decay into the token-level check
  # it exists to replace -- so the false positive is kept and the gate is left advisory instead.
  #
  # The ceiling started at the size on the day the gate landed, so it governs GROWTH only, and
  # ratchets down after each cut (`python util/memory_budget_check.py --ratchet`).
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  memory-budget:
    name: Memory Budget
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the base tip to apply the no-worsening rule

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Check memory-file size budget
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Memory File Size Budget (BLOCKING)      ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # merge_group has no github.base_ref; fall back to main so the job still reports.
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$BASE_REF"
          # Allow-Budget-Overrun is a LOAN, not a pass: it suppresses the failure without moving
          # the ceiling, so the debt still blocks the next author. Trailers are injected from an
          # explicit file (the checker never shells out for them) so the classifier stays pure.
          # Two-dot FETCH_HEAD..HEAD = exactly the commits this PR adds on top of base.
          git log --format=%B FETCH_HEAD..HEAD > memory-budget-trailers.txt
          # P4: BLOCKING as of 2026-08-20. `--advisory` is deliberately absent -- a
          # violation now exits 1 and fails this check. Promotion to a REQUIRED context
          # happens in the branch ruleset, never via the Quality Gate `needs:`.
          #
          # Escape hatch, when the growth is genuinely warranted: add the commit trailer
          #   Allow-Budget-Overrun: AGENTS.md
          # and carry it into the SQUASH message. That is a LOAN -- the ceiling does not
          # move, so the debt blocks the next author until someone relocates.
          python3 util/memory_budget_check.py \
            --base-ref FETCH_HEAD \
            --trailers-file memory-budget-trailers.txt

      - name: Check relocation completeness (G3)
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Relocation Completeness G3 (advisory)   ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          # The docs-deletion screen CANNOT see a relocation: its FAIL predicate needs
          # `added == 0`, so "delete a block, leave a pointer, keep the heading" is a WARN at
          # any magnitude. Without G3 the P3 migration has no content-loss control at all.
          # Deliberately prose-level, not token-level: a relocation that carries the
          # identifiers while dropping the reasoning is the loss this repo actually suffers,
          # and a token check waves it through.
          BASE_REF="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$BASE_REF"
          python3 util/relocation_check.py \
            --base FETCH_HEAD --head HEAD \
            --source AGENTS.md --dest docs/REFERENCE.md \
            --advisory

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Sequence Safety (ADVISORY, standalone): the per-PR compositional-loss screen (Proposal P2 gates
  # G1 + G2; flood-remediation §4 item 8 phase 3). Runs the AST symbol-loss screen + the docs
  # deletion-magnitude screen over the PR's base..HEAD (the merge ref on pull_request; the queued
  # composition on merge_group), so the silent-deletion / net-docs-deletion classes the flood shipped
  # are visible AT REVIEW. Uploads both JSON reports as the `sequence-safety-report` artifact a
  # supervisor consumes (P2 G5-vi).
  #
  # ADVISORY, NOT required (the codeql soak convention): this job is deliberately ABSENT from the
  # Quality Gate `needs:` -- mirroring the release-train-archive-guard precedent -- for two grounded
  # reasons. (1) It is pull_request / merge_group-only (skipped on push), and the Quality Gate is
  # `if: always()` and treats any non-success need as fatal, so folding it into that `needs:` would
  # fail every push:main. (2) The fleet-tuned false-positive rate is unknown; soak it as its own
  # advisory status check first, then promote to REQUIRED directly in the branch ruleset (NEVER via
  # the Quality-Gate `needs:`). Even promoted, the owner + Cursor App always-bypass it, so its
  # guaranteed value is the visible red at review; enforcement is G3 (main-verify.yml).
  #
  # Label hatch (WARN-only, P2 SF5): the owner-applied `allow-symbol-loss` / `docs-rewrite` PR labels
  # demote THAT screen's FAIL to WARN-only for this run (`--advisory`: exit 0 with findings still
  # printed). A bare label is a blanket per-PR override, intentionally demoted to WARN-only; the
  # auditable enumerated `Allow-Symbol-Loss:` / `Allow-Docs-Rewrite:` commit trailer (parsed inside
  # the modules, travels in git history so it also covers the post-merge G3) stays the PRIMARY waiver.
  # Labels are read live via `gh pr view` so applying one + re-running the job takes effect with no
  # re-push. merge_group has no PR object -> a queued merge is screened strict (no label downgrade).
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  sequence-safety:
    name: Sequence Safety
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: read # gh pr view --json labels for the WARN-only label hatch
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need base + head for the three-dot merge-base screens

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Install sequence-safety screens (juniper-ci-tools)
        run: |
          # The two screens now ship as the PyPI package juniper-ci-tools (>=0.8.0),
          # replacing the deleted in-repo util/sequence_safety/ copy (rollout W3).
          # The console scripts juniper-symbol-loss-check / juniper-docs-additions-check
          # land on PATH once installed.
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.8.0,<0.9.0"

      - name: Run sequence-safety screens (symbol + docs)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -uo pipefail
          set +e # this step handles the screen exit codes manually
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Per-PR Sequence-Safety Screens         ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE_SHA"; else base="$MG_BASE_SHA"; fi
          if [ -z "$base" ]; then
            echo "::error::could not resolve a base sha for event ${EVENT_NAME}"
            exit 2
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" || true
          fi
          # Label hatch: read the PR's CURRENT labels (live via gh, so apply-label + re-run
          # works with no push). Only meaningful on pull_request (merge_group has no PR object).
          sym_adv=""
          docs_adv=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            labels="$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || true)"
            if printf '%s\n' "$labels" | grep -qx 'allow-symbol-loss'; then sym_adv="--advisory"; echo "label allow-symbol-loss -> symbol screen ADVISORY (WARN-only)"; fi
            if printf '%s\n' "$labels" | grep -qx 'docs-rewrite'; then docs_adv="--advisory"; echo "label docs-rewrite -> docs screen ADVISORY (WARN-only)"; fi
          fi
          echo "Screening ${base} .. HEAD"
          echo ""
          echo "--- symbol-loss screen ---"
          # Explicit --scope globs reproduce ml's historical in_scope() predicate
          # (top-level tests/*.py + util/**/*.py + util/**/*.bash) verbatim; proven
          # byte-identical to the deleted in-repo module over 91 ref ranges (rollout W3).
          # shellcheck disable=SC2086  # $sym_adv is an intentional empty-or---advisory token
          juniper-symbol-loss-check --scope 'tests/*.py' --scope 'util/**/*.py' --scope 'util/**/*.bash' --base "$base" --head HEAD $sym_adv
          src=$?
          # shellcheck disable=SC2086
          juniper-symbol-loss-check --scope 'tests/*.py' --scope 'util/**/*.py' --scope 'util/**/*.bash' --base "$base" --head HEAD $sym_adv --json > symbol-report.json || true
          echo ""
          echo "--- docs deletion-magnitude screen ---"
          # No --scope: the universal docs cluster (AGENTS.md + docs/**/*.md + notes/**/*.md)
          # is the package default and matches ml's historical in_docs_scope() verbatim.
          # shellcheck disable=SC2086
          juniper-docs-additions-check --base "$base" --head HEAD $docs_adv
          drc=$?
          # shellcheck disable=SC2086
          juniper-docs-additions-check --base "$base" --head HEAD $docs_adv --json > docs-report.json || true
          echo ""
          echo "symbol screen exit=${src} ; docs screen exit=${drc}"
          if [ "${src}" -ge 2 ] || [ "${drc}" -ge 2 ]; then
            echo "::error::sequence-safety screen invocation error (see log)"
            exit 2
          fi
          if [ "${src}" -ge 1 ] || [ "${drc}" -ge 1 ]; then
            echo "::error::per-PR compositional-loss finding(s) -- see the screens above and the sequence-safety-report artifact. Waive an intended removal with an Allow-Symbol-Loss / Allow-Docs-Rewrite commit trailer, or (owner) apply the allow-symbol-loss / docs-rewrite label for a WARN-only downgrade."
            exit 1
          fi
          echo "::notice::sequence-safety screens clean (or waived) for this PR"

      - name: Upload sequence-safety report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sequence-safety-report
          path: |
            symbol-report.json
            docs-report.json
          if-no-files-found: warn
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Fleet PR Lint (ADVISORY, warnings-only, ALWAYS exit 0): a best-practices conformance surface for
  # the Cursor automation fleet's PRs (Proposal P2 G5-iv; flood-remediation §4 item 8 phase 4). Runs
  # ONLY on a pull_request whose head branch is `cursor/*` (the fleet's branch convention). It never
  # fails and never comments -- every signal goes to the job step summary:
  #   * commit count > 1            -> warn (the fleet's single-tidy-commit convention)
  #   * changed .py not black-clean -> warn (repo-pinned black 26.3.1 --line-length 512)
  #   * touched-file count          -> note (fan-out proxy; scope is not machine-declarable, P2 G5-iv)
  #   * touches AGENTS.md or docs/DEVELOPER_CHEATSHEET_JUNIPER-ML.md -> hotspot note (the flood's top
  #     same-file clusters)
  # Advisory-only by design: it informs the owner's review, it never gates. Standalone (absent from
  # the Quality Gate `needs:`), so its skip on a non-cursor PR / push / merge_group never affects the
  # gate.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  fleet-pr-lint:
    name: Fleet PR Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'cursor/')
    permissions:
      contents: read
    steps:
      - name: Checkout Code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Install black (repo-pinned)
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          # Match the .pre-commit-config.yaml black hook (rev 26.3.1) exactly so the advisory
          # formatting signal never disagrees with the required pre-commit lane.
          pip install "black==26.3.1"

      - name: Fleet-PR best-practices lint (advisory, never fails)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PR_CHANGED: ${{ github.event.pull_request.changed_files }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          set +e # advisory: never let a lint probe fail the job
          base="$PR_BASE_SHA"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" || true
          fi
          {
            echo "## Fleet PR Lint (advisory)"
            echo ""
            echo "Branch \`${HEAD_REF}\` -- warnings only; this check never fails and never comments."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # 1) commit count (single-tidy-commit convention)
          if [ -n "${PR_COMMITS}" ] && [ "${PR_COMMITS}" -gt 1 ] 2>/dev/null; then
            echo "- :warning: **${PR_COMMITS} commits** on the branch -- the fleet convention is a single tidy commit (squash before merge)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- commit count: ${PR_COMMITS:-?} (ok)." >> "$GITHUB_STEP_SUMMARY"
          fi
          # 2) changed .py black-clean (repo-pinned black --line-length 512; excludes deletions)
          mapfile -t py_files < <(git diff --name-only --diff-filter=d "${base}...HEAD" -- '*.py' 2>/dev/null || true)
          if [ "${#py_files[@]}" -gt 0 ]; then
            if black --check --line-length 512 "${py_files[@]}" > black.out 2>&1; then
              echo "- black: ${#py_files[@]} changed .py file(s) formatted (ok)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- :warning: **black --check** reports unformatted changed .py file(s):" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              grep -E 'would reformat|reformatted|error:' black.out >> "$GITHUB_STEP_SUMMARY" || true
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- black: no changed .py files." >> "$GITHUB_STEP_SUMMARY"
          fi
          # 3) touched-file count (fan-out proxy)
          changed_count="$(git diff --name-only "${base}...HEAD" 2>/dev/null | wc -l | tr -d ' ')"
          echo "- touched files: ${changed_count} (payload changed_files: ${PR_CHANGED:-?})." >> "$GITHUB_STEP_SUMMARY"
          if [ "${changed_count}" -gt 15 ] 2>/dev/null; then
            echo "  - :warning: high fan-out (> 15 files); confirm the change stays within one declared purpose." >> "$GITHUB_STEP_SUMMARY"
          fi
          # 4) hotspot files (the flood's top same-file clusters)
          changed_all="$(git diff --name-only "${base}...HEAD" 2>/dev/null || true)"
          if printf '%s\n' "$changed_all" | grep -qx 'AGENTS.md'; then
            echo "- :fire: touches **AGENTS.md** (a flood hotspot -- expect same-file contention with sibling fleet PRs)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if printf '%s\n' "$changed_all" | grep -qx 'docs/DEVELOPER_CHEATSHEET_JUNIPER-ML.md'; then
            echo "- :fire: touches **docs/DEVELOPER_CHEATSHEET_JUNIPER-ML.md** (a flood hotspot)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Build: Build the package and validate with twine
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  build:
    name: Build and Validate Package
    runs-on: ubuntu-latest
    needs: [pre-commit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Build Package                           ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m build

      - name: Validate package
        run: twine check dist/*

      - name: Verify installable (editable)
        run: pip install -e .

      - name: Verify extras metadata is declared
        run: |
          python -c "
          import importlib.metadata
          meta = importlib.metadata.metadata('juniper-ml')
          extras = importlib.metadata.requires('juniper-ml') or []
          print('Declared extras:', meta.get_all('Provides-Extra'))
          print('Requirements:', extras)
          assert 'clients' in (meta.get_all('Provides-Extra') or []), 'clients extra missing'
          assert 'worker' in (meta.get_all('Provides-Extra') or []), 'worker extra missing'
          print('All extras verified.')
          "

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Docs: Validate documentation link integrity
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  docs:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      # Wave 2 of the doc-link migration plan
      # (notes/JUNIPER_2026-05-18_JUNIPER-ML_DOC-TOOLS-PYPI-MIGRATION-PLAN.md): the
      # validator is installed from PyPI instead of run from the inline
      # util/check_doc_links.py copy. The inline copy stays in place
      # through Wave 4 so this swap remains a one-line revert.
      - name: Install juniper-doc-tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-doc-tools>=0.1.0,<0.2.0"

      - name: Validate Documentation Links
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Documentation Link Validation           ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-check-doc-links \
            --exclude templates \
            --exclude history \
            --exclude legacy \
            --exclude pull_requests \
            --exclude releases \
            --exclude analysis \
            --exclude fixes \
            --exclude development \
            --exclude CHANGELOG.md \
            --cross-repo skip

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Security: pip-audit for dependency vulnerabilities
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    # security-events: write is required by gitleaks-action to upload its SARIF.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans full git history, not just the tip commit.
          fetch-depth: 0

      # Added 2026-08-13 (Tier 2 CI hardening). juniper-ml was the ONLY repo of the nine
      # with no secret scanning: six siblings run Gitleaks as a step inside their
      # `Security Scans` job and juniper-deploy runs it as a standalone job, while this
      # job ran pip-audit alone. That gap mattered here specifically — this repo carries
      # SOPS-encrypted `.env` / `.env.secrets`, and the `no-unencrypted-env` pre-commit
      # hook only catches a plaintext env file being committed, not a credential pasted
      # into any other tracked file. Kept as a STEP (not a new job) so it is covered by
      # the already-required `Security Scan` context and needs no ruleset change.
      - name: Run Gitleaks (Secrets Detection)
        # gitleaks-action rejects `repository_dispatch` outright ("the
        # [repository_dispatch] event is not yet supported"), which would kill the whole
        # job on ecosystem-fanout runs. Mirrors juniper-cascor / juniper-data / juniper-canopy.
        if: github.event_name != 'repository_dispatch'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action ships as a Node.js 20 action; opt into Node 24 to match the
          # sibling repos and avoid the deprecation warning. Drop once upstream repins.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        # No `fail` input exists on this action version (passing it errors); it exits
        # non-zero on leaks by default, which is the behaviour we want.

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}

      - name: Run pip-audit
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - pip-audit Security Scan                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          python -m pip install --upgrade "pip>=26.1.1"
          pip install pip-audit
          pip install -e .
          # --skip-editable so the meta-package itself (installed as editable)
          # is not audited; pip-audit would otherwise try to look juniper-ml up
          # on PyPI by name and fail for unreleased versions.
          #
          # --strict is intentionally omitted: pip-audit counts a skipped
          # editable install as "dependency collection failure", and --strict
          # would escalate that to a fatal error. Real vulnerabilities still
          # cause exit 1 without --strict.
          pip-audit --desc on --skip-editable

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Claude.yml access audit: structurally validates the live
  # .github/workflows/claude.yml against the L2/L3 safeguards from
  # notes/JUNIPER_2026-05-10_JUNIPER-ECOSYSTEM_ANTHROPIC-API-KEY-ACCESS-VALIDATION-WALKTHROUGH.md.
  # The validator's unit tests already run inside the `tests:` matrix;
  # this job additionally exercises the script against the real claude.yml
  # so a regression in the workflow file itself blocks merge.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  claude-yaml-audit:
    name: Claude.yml Access Audit
    runs-on: ubuntu-latest
    needs: [pre-commit]
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate .github/workflows/claude.yml
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - claude.yml Public-Repo Access Audit     ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          bash util/validate_claude_yaml_access.bash .github/workflows/claude.yml

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Dependency Documentation: Generate pip dependency records
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  dependency-docs:
    name: Dependency Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.PYTHON_TEST_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_TEST_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install -e .

      # Wave 2 of the dep-docs PyPI migration (plan
      # notes/JUNIPER_2026-05-20_JUNIPER-ML_CI-TOOLS-PYPI-MIGRATION-PLAN.md):
      # invoke the PyPI-published juniper-ci-tools console script
      # instead of the inline util/generate_dep_docs.sh. The inline
      # script will be removed from the tree in Wave 4 once the new
      # step has soaked. Pinned <0.2.0 so a future major bump can be
      # adopted deliberately per-repo.
      - name: Install juniper-ci-tools
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "juniper-ci-tools>=0.1.0,<0.9.0"

      - name: Generate Dependency Documentation
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Dependency Documentation                ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          juniper-generate-dep-docs

      - name: Upload Dependency Documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-docs
          path: |
            conf/requirements_ci.txt
            conf/requirements_ci_*.txt
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # SOPS Validation: prove every tracked *.enc file is actually encrypted
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Added 2026-08-13 (Tier 2 CI hardening). This repo has a live `.sops.yaml` and a
  # tracked `.env.enc`, but nothing in CI verified the ciphertext — juniper-deploy was
  # the only repo running this check. The `no-unencrypted-env` pre-commit hook blocks a
  # PLAINTEXT `.env` from being committed; it does not verify that a file NAMED `.enc`
  # actually contains SOPS ciphertext. A partially-decrypted or hand-edited `.env.enc`
  # would sail through. Structural only — no age key needed, so it runs on every PR.
  # Mirrors juniper-deploy's sops-validation job.
  sops-validation:
    name: SOPS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for encrypted files
        id: check-enc
        run: |
          ENC_FILES=$(find . -path ./.git -prune -o \( -name '*.env.enc' -o -name '*.env.secrets.enc' \) -print 2>/dev/null)
          if [ -z "$ENC_FILES" ]; then
            echo "No encrypted files found — skipping validation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Found encrypted files:"
            echo "$ENC_FILES"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate SOPS metadata structure
        if: steps.check-enc.outputs.skip != 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - SOPS Structural Validation              ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          exit_code=0
          for file in $(find . -path ./.git -prune -o \( -name '*.env.enc' -o -name '*.env.secrets.enc' \) -print); do
            echo "Validating: $file"

            # Required SOPS metadata fields.
            for key in sops_version sops_lastmodified; do
              if ! grep -q "^${key}=" "$file" 2>/dev/null; then
                echo "  FAIL: Missing SOPS metadata key: ${key}"
                exit_code=1
              fi
            done
            # age recipient — prefix match so multiple recipients still pass.
            if ! grep -q "^sops_age__" "$file" 2>/dev/null; then
              echo "  FAIL: Missing SOPS age recipient metadata"
              exit_code=1
            fi

            # Every value line must carry SOPS ciphertext. This is the check the
            # pre-commit hook cannot make: it catches a plaintext value inside a file
            # that is merely NAMED .enc.
            plaintext=$(grep -v '^#' "$file" | grep -v '^sops_' | grep -v '^$' | grep -cv 'ENC\[AES256_GCM,' 2>/dev/null) || plaintext=0
            if [ "$plaintext" -gt 0 ]; then
              echo "  FAIL: $plaintext line(s) contain non-encrypted values"
              exit_code=1
            else
              echo "  PASS: All values are SOPS-encrypted"
            fi
          done
          exit $exit_code

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # Quality Gate: All required checks must pass
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  required-checks:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [pre-commit, tests, build, docs, security, claude-yaml-audit, dependency-docs, sops-validation]
    steps:
      - name: Check Quality Gate Status
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-ml - Quality Gate Status                     ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Pre-commit:           ${{ needs.pre-commit.result }}"
          echo "Tests:                ${{ needs.tests.result }}"
          echo "Build:                ${{ needs.build.result }}"
          echo "Docs:                 ${{ needs.docs.result }}"
          echo "Security:             ${{ needs.security.result }}"
          echo "Claude.yml Audit:     ${{ needs.claude-yaml-audit.result }}"
          echo "Dependency Docs:      ${{ needs.dependency-docs.result }}"
          echo "SOPS Validation:      ${{ needs.sops-validation.result }}"
          echo ""

          if [[ "${{ needs.pre-commit.result }}" != "success" ]]; then
            echo "::error::Pre-commit checks failed"
            exit 1
          fi

          if [[ "${{ needs.tests.result }}" != "success" ]]; then
            echo "::error::Regression tests failed"
            exit 1
          fi

          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::Package build/validation failed"
            exit 1
          fi

          if [[ "${{ needs.docs.result }}" != "success" ]]; then
            echo "::error::Documentation link validation failed"
            exit 1
          fi

          # Security: failure = error, skipped = OK
          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "::error::Security scan failed"
            exit 1
          fi

          if [[ "${{ needs.claude-yaml-audit.result }}" != "success" ]]; then
            echo "::error::Claude.yml access audit failed"
            exit 1
          fi

          if [[ "${{ needs.dependency-docs.result }}" != "success" ]]; then
            echo "::error::Dependency documentation generation failed"
            exit 1
          fi

          if [[ "${{ needs.sops-validation.result }}" != "success" ]]; then
            echo "::error::SOPS structural validation failed"
            exit 1
          fi

          echo "::notice::Quality Gate PASSED"
