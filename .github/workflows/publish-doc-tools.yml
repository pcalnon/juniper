---
#####################################################################################################################################################################################################
# Project:       Juniper
# Application:   juniper-doc-tools (subdirectory of juniper-ml)
# File Name:     publish-doc-tools.yml
# Author:        Paul Calnon
#
# Date Created:  2026-05-18
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    GitHub Actions publish pipeline for the juniper-doc-tools package
#    (Wave 1 of the doc-link validator PyPI migration -- see
#    notes/JUNIPER_2026-05-18_JUNIPER-ML_DOC-TOOLS-PYPI-MIGRATION-PLAN.md).
#    Triggered by tags matching ``juniper-doc-tools-v*`` so it stays
#    decoupled from the juniper-ml meta-package's own ``v*`` release
#    tags. Publishes to TestPyPI first (with install verification),
#    then PyPI, via OIDC trusted publishing.
#
#####################################################################################################################################################################################################

name: Publish juniper-doc-tools to PyPI

on:
  # Publish ONLY on a cut GitHub Release (the ratified convention — never a bare `git push <tag>`).
  # We deliberately do NOT subscribe to `push: tags`: cutting a Release also creates the tag, which
  # emits a `push: tags` event — subscribing to both fired TWO concurrent publish runs that raced the
  # immutable TestPyPI upload (one uploaded, the other 400'd "file already exists"; see #555). The
  # build job is tag-prefix-guarded below; `release: published` is the single publish path.
  release:
    types: [published]
  workflow_dispatch:

# P4 (juniper-ml#357): `id-token: write` is scoped to the two publish jobs
# below, NOT granted workflow-wide. The build job has no business being able
# to mint a PyPI OIDC credential.
permissions:
  contents: read

concurrency:
  # Belt-and-suspenders serialization keyed on the ref. The primary dedupe is the single
  # `release: published` trigger above; `skip-existing` on the publish steps makes any residual
  # overlap (e.g. a manual dispatch during a release) a no-op rather than an immutable-upload race.
  group: publish-doc-tools-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Validate
    # Run for a tag push (filtered above) or workflow_dispatch; for a `release` event, only when the
    # release is THIS package's tag -- a release for another package (or the meta `v*` release) also
    # fires this workflow and must be skipped. Downstream jobs `needs: build`, so this one guard
    # gates the whole pipeline.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'juniper-doc-tools-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: juniper-doc-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # NOTE (2026-08-24): a "Require a GitHub Release for this tag" step used to sit
      # here, gated on `if: github.event_name == 'push'`. This workflow does NOT
      # subscribe to `push:` (see the `on:` block above -- that was removed after #555,
      # where Release-plus-push double-fired and raced the immutable TestPyPI upload),
      # so the condition was never true and the step could never run. Dead code shaped
      # like a guard is worse than no guard: it reads as though a bare `git push <tag>`
      # is blocked here.
      #
      # The real safety property is STRONGER than that step ever was. With
      # `release: published` as the only automatic trigger, a bare tag push starts no
      # run at all -- nothing is built and nothing is uploaded. The gate is the trigger.
      # `tests/test_publish_release_only_trigger.py` pins it.

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Validate distribution metadata
        run: twine check dist/*

      # P3 (juniper-ml#357/#358): prove we are building a TAG, and that the tag's
      # version matches the wheel actually built. Defense in depth -- the
      # environment tag policy is the real control (it survives a workflow edit;
      # this step does not), but this fails earlier and names the reason.
      # `../` because this job runs with working-directory: juniper-doc-tools
      - name: Assert release tag matches built version
        run: |
          ../util/assert_release_tag.bash \
            --ref "${{ github.ref }}" \
            --dist-dir dist \
            --expect-prefix juniper-doc-tools-v

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: juniper-doc-tools-dist
          path: juniper-doc-tools/dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    # P4: OIDC minting lives here, not at workflow level.
    permissions:
      id-token: write
      contents: read
    environment:
      name: testpypi
      url: https://test.pypi.org/p/juniper-doc-tools
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: juniper-doc-tools-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          verbose: true
          skip-existing: true  # tolerate an already-uploaded immutable artifact (re-run / overlap)

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            juniper-doc-tools/pyproject.toml

      - name: Verify install from TestPyPI
        run: |
          set -euo pipefail
          version=$(grep '^version' juniper-doc-tools/pyproject.toml | head -1 | sed -E 's/version = "(.+)"/\1/')
          for attempt in 1 2 3 4 5; do
            if pip install \
              --no-deps \
              --index-url https://test.pypi.org/simple/ \
              "juniper-doc-tools==${version}"; then
              break
            fi
            echo "TestPyPI index lag — retrying in 10s (attempt ${attempt}/5)"
            sleep 10
          done
          python -c "import juniper_doc_tools; print('TestPyPI install OK', juniper_doc_tools.__version__)"
          juniper-check-doc-links --version
          python -m juniper_doc_tools --version

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    # P4: OIDC minting lives here, not at workflow level.
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/juniper-doc-tools
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: juniper-doc-tools-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
          verbose: true
          skip-existing: true  # tolerate an already-uploaded immutable artifact (re-run / overlap)
