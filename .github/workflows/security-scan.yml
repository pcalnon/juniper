name: Scheduled Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install pip-audit
          # The EXTRAS are the audit surface, and installing them is load-bearing.
          # juniper-ml is a meta-package: `[project].dependencies` is `[]` BY DESIGN, so a
          # bare `pip install -e .` pulls NOTHING and pip-audit then scans only its own
          # dependency tree and reports green -- a check that audited nothing for as long
          # as it has existed. The risk this workflow uniquely owns is "does
          # `pip install juniper-ml[X]` pull a vulnerable transitive dependency?", and that
          # lives entirely in [project.optional-dependencies].
          #
          # [servers] and [worker] are deliberately EXCLUDED: they pull juniper-canopy /
          # cascor / data and torch (multi-GB), and each of those repos runs its own
          # pip-audit over the same tree. What is NOT covered elsewhere -- and is covered
          # here -- is this repo's own pin RANGES admitting a vulnerable version.
          # Resolves ~38 packages, no torch/CUDA: fastapi, starlette, uvicorn, pydantic,
          # numpy, requests, urllib3, certifi, websockets, PyYAML.
          pip install -e ".[clients,tools,recurrence]"

      - name: Run pip-audit (Dependency Vulnerabilities)
        run: pip-audit --strict --desc on
