# WIDE-BUDGET HEAD-TO-HEAD, n_rotations 3.0 (the HARD spiral) -- ONE config, BOTH arms.
#
# Project:     juniper-ml
# Sub-Project: ad-hoc tooling
# Author:      Paul Calnon
# Created:     2026-08-16
# Status:      ad-hoc -- one-off (wide-budget head-to-head campaign)
# Retire when: the wide-budget head-to-head evidence note is merged; delete then.
# Related:     util/experiments/suites/p4/e-j-h2h-wide-cap{64,128}.yaml (the two suites that
#              override max_hidden_units and multiply this into three seeded replicates);
#              util/ad-hoc/2026-08-16_h2h_cli_arm.bash (the direct-CLI arm runner).
#
# This is the BASE config. The SERVICE arm never reads this file directly: run_suite writes a
# fully-resolved <suite_dir>/cells/<cell_id>/experiment.yaml per cell and the driver runs THAT.
# The direct-CLI arm must be handed the SAME generated cell file -- feeding it this base would
# give every CLI replicate one seed while the service arm varied, silently destroying the
# comparison this campaign exists to make.
#
# ---------------------------------------------------------------------------------------------
# EQUALISATION DOCTRINE
#
# ##############################################################################################
# TAXONOMY CORRECTION -- 2026-08-24. READ BEFORE TRUSTING ANY BUCKET LABEL BELOW.
#
# juniper-cascor#556 (L-4 full parity, merged 15ad3d8) added NINE entries to
# _W11_TRAINING_KEY_MAP. SIX of them are keys this file classifies as EQUALISE or OMIT
# *because they were unmapped*. That premise is now false for every one of them:
#
#     candidate_patience  candidate_learning_rate  convergence_threshold
#     candidate_convergence_threshold  early_stopping  max_iterations
#
# All six are MAPPED today -- grep `_W11_TRAINING_KEY_MAP` in juniper-cascor/src/main.py and
# read the entries; do not trust a line number, the file moved 19 commits in three days.
#
# NO VALUE IN THIS FILE WAS CHANGED by that correction, deliberately: seven shipped suites use
# this file as their base_config (p4/e-j-h2h-wide-cap64, -cap64-init42, -cap128,
# p4/e-k-thread-probe-cap16, p4/e-l-determinism-cap4, p4/e-m-h2h-paired-cap64,
# p4/e-n-profile-cap4), so editing a param here silently re-measures all seven. Only the
# reasoning was corrected.
#
# WHAT THIS MEANS FOR THE NEXT CAMPAIGN. The doctrine's own logic now points the other way for
# the OMIT bucket: pre-#556 the safe move was to omit a key so neither arm could receive it;
# post-#556 the safe move is to SET it, because both arms honour it and omission leaves each
# side on its own default -- which #556's commit note shows were NOT equal (spiral-baseline asks
# candidate_learning_rate 0.05 / convergence_threshold 1.0e-5 while the CLI ran the constants
# 0.1 and 0.001, 2x and 100x looser). The equalisation rationale below is therefore STALE, not
# merely mislabelled: re-derive it against the current map before running this config again.
# ##############################################################################################
#
# The direct CLI can only receive the YAML keys carried by main.py's _W11_DATASET_KEY_MAP /
# _W11_TRAINING_KEY_MAP (grep those names in juniper-cascor/src/main.py). Every key below is
# therefore classified into exactly one of three buckets, and nothing is left to chance:
#
#   MAPPED   -- in the CLI map; both arms honour the configured value. Set it explicitly.
#   EQUALISE -- NOT in the CLI map, but setting it on the service makes the service behave the
#               way the CLI already does by default. Set it, and prove it from the logs.
#   OMIT     -- NOT in the CLI map, and setting it would change one arm only. Leave it unset so
#               BOTH arms fall through to the same cascor_constants default. Equality then is
#               structural, not an assumption about anyone's defaults.
#
# The OMIT bucket WAS why this file must NOT inherit juniper-cascor/conf/experiments/
# spiral-baseline.yaml the way E-I did: that file sets `candidate_patience: 100`, which the CLI
# could not receive, so the two arms would differ on a candidate knob and the head-to-head would
# be invalid. VOID since cascor#556 -- the CLI receives candidate_patience now, so that specific
# objection to inheriting spiral-baseline no longer holds. The base_config is nonetheless
# UNCHANGED, because re-pointing it would re-measure the seven dependent suites; treat a switch
# as its own decision with its own re-baseline, not as a cleanup.
#
# Consequence, stated plainly: absolute accuracies here will NOT sit on E-I's capacity
# curve. That curve is a TARGETING rationale (it is what identified 64-128 units as the region
# where a small path gap could still hide), not a comparison baseline.
#
# ---------------------------------------------------------------------------------------------
# THE max_epochs TRAP (found 2026-08-16; not present in the smoke pair's reasoning)
#
# `max_epochs` and `output_epochs` are NOT interchangeable across the two paths:
#
#   * CLI      -- _W11_TRAINING_KEY_MAP aliases max_epochs -> output_epochs, so max_epochs sets
#                 the budget for EVERY output pass.
#   * SERVICE  -- TrainingParams.max_epochs is the INITIAL output pass only. Every later
#                 per-round pass reads self.output_epochs (cascade_correlation.py:4591/4768/4820),
#                 which falls back to _PROJECT_MODEL_OUTPUT_EPOCHS = 10000 when unset
#                 (cascade_correlation.py:716). The source says so at :1876-1882: "The two
#                 therefore agree only while a caller leaves max_epochs unset".
#
# So `max_epochs: 2000` ALONE would give the CLI 2000 epochs per pass and the service 10000 on
# every round after the first -- a 5x per-pass asymmetry across 64-128 rounds, which would both
# slow the service arm and train it harder. Setting BOTH keys to the same value removes the
# question entirely: the CLI takes explicit output_epochs (which wins over the alias) and the
# service gets initial == per-round. The smoke pair set only max_epochs; at a 2-unit cap it had
# one round and the trap could not bite.
#
# ---------------------------------------------------------------------------------------------
# BUDGET
#
# Per-pass budgets are spiral-baseline's (2000 / 500 / patience 200), NOT the smoke pair's
# (100 / 50 / 50). Deliberate: the smoke values are 4-20x smaller, and under-training each of
# 64-128 units would compress both arms toward a floor and destroy the very resolution this
# campaign is buying. patience 200 is what actually ends an output pass, so output_epochs 2000
# is a ceiling that is rarely reached -- behaviourally equivalent to E-I's 10000 ceiling at the
# same patience, but explicit on both paths.
#
# outputs.max_wall_seconds is 14400 (E-I's value). Unset it inherits the driver's 3600 s default,
# which is the E-I budget trap: the widest E-A cell came within 707 s of a 3600 s budget its
# write-up never mentioned. per_run_timeout_seconds in the suites is set ABOVE this so the DRIVER
# is what stops a run -- it writes an honest `timed_out` manifest where a subprocess kill leaves
# none.
schema_version: 1
experiment:
  name: h2h-wide-nrot3
  # OVERRIDDEN PER CELL. The suites use experiment.description as the replicate axis: it is the
  # only config key that is legal (driver EXPERIMENT_KEYS), inert (recorded in the manifest,
  # never sent to any service -- run_experiment.py:1390), and free of side effects, so a
  # 3-valued axis on it multiplies the suite into three cells WITHOUT perturbing the experiment.
  # run_suite has no replicate primitive; this is the structure chosen instead of improvising.
  description: "Wide-budget head-to-head -- hard spiral, base (overridden per replicate)"
  # Base seed. seed_policy: per_cell rewrites BOTH this and dataset.params.seed to
  # base_seed + cell.index, so the replicates are 20260729 / 20260730 / 20260731. Because
  # cell.index restarts at 0 in each suite, the cap-64 and cap-128 suites derive the SAME three
  # seeds -- which is the point: each cap-64 replicate is paired with a cap-128 replicate on
  # identical data, and the whole campaign resolves to 3 dataset ids, not 6.
  seed: 20260729

service:
  log_level: INFO
  metrics_enabled: true      # code default is FALSE; required for /metrics sampling (G-3)
  auto_start: false          # the driver starts training
  auto_start_data_service: false

dataset:
  generator: spiral
  persist: true
  tags: ["h2h", "wide", "nrot3"]
  ttl_seconds: 86400
  params:
    n_spirals: 2                 # MAPPED
    n_points_per_spiral: 500     # MAPPED
    # MAPPED, and the ONLY dataset knob that differs between the paths by DEFAULT
    # (CLI _SPIRAL_PROBLEM_NUM_ROTATIONS = 1 vs the service surface's 3.0). Leaving it implicit
    # is what silently invalidated the historical CLI-vs-service numbers.
    n_rotations: 3.0
    noise: 0.05                  # MAPPED
    train_ratio: 0.8             # MAPPED
    test_ratio: 0.2              # MAPPED
    # MAPPED (-> random_seed). REWRITTEN PER CELL by seed_policy: per_cell -- the rewrite is
    # conditional on the key already existing, so it must stay present here.
    seed: 20260729
    # OMIT: `algorithm` and `radius` are absent from _W11_DATASET_KEY_MAP, so the CLI *cannot*
    # send them. Omitting means NEITHER arm sends them and both take juniper-data's default.
    # spiral-baseline sets `algorithm: modern`; inheriting it would be a one-sided dataset knob.

training:
  start_fresh: true
  params:
    # --- MAPPED: both arms honour these ---
    max_hidden_units: 64         # THE AXIS UNDER TEST; overridden to 64 / 128 by the suites
    candidate_pool_size: 8       # the value the interesting region was characterised at.
                                 # NOT swept: E-A settled that pool raises candidate correlation
                                 # but not accuracy, so a pool column would re-measure a closed
                                 # question. (The smoke pair used 4.)
    learning_rate: 0.05
    correlation_threshold: 0.2
    patience: 200
    candidate_epochs: 500
    # Both set, to the same value -- see THE max_epochs TRAP above. Do not drop either.
    max_epochs: 2000             # service: initial output pass. CLI: alias -> output_epochs.
    output_epochs: 2000          # service: every per-round output pass. CLI: wins over the alias.

    # --- EQUALISE: service-only keys whose value matches what the CLI already does ---
    # SUPERSEDED 2026-08-24 (cascor#556): max_iterations is MAPPED now, so it binds BOTH arms
    # directly -- the CLI no longer runs the constant 1000000 and is no longer bounded by
    # max_hidden_units alone. The value below still equalises, but for a simpler reason than the
    # one recorded here, and this key now belongs in MAPPED rather than EQUALISE. Original
    # reasoning, kept because the cap arithmetic in the next sentence is still load-bearing: it
    # must CLEAR the largest cap or that cap can never bind and the R-3 defect returns in a new
    # costume: growth adds one unit per iteration, so 128 is exactly enough for cap 128 and
    # inert at cap 64. Confirm it worked by checking units == max_hidden_units on both arms.
    #
    # Do NOT cite derive_epochs_cap as the reason the cap binds: its own docstring
    # (api/lifecycle/manager.py:1636-1639) calls min(max_iterations, max_hidden_units) a
    # reporting/display budget and says enforcement "stays with the granular limits themselves".
    max_iterations: 128
    # SUPERSEDED 2026-08-24 (cascor#556): early_stopping is MAPPED now, so `true` below is
    # honoured by BOTH arms explicitly rather than by the service matching a CLI default the
    # YAML could not reach. Also a MAPPED key today, not EQUALISE. Original reasoning:
    # early_stopping was unmapped, and the CLI's default is True (its smoke-run
    # fit:1918 line reads "early stopping: True" with nothing in the YAML able to set it).
    # Setting it True here makes the service match. Both arms PRINT the resolved value on that
    # same line, so max_epochs / max_iterations / early_stopping are all provable from the logs.
    early_stopping: true

    # --- OMIT: BUCKET INVALIDATED 2026-08-24 (cascor#556) -- all four keys are MAPPED ---
    # The bucket's premise was "unmapped, so setting them would move one arm only". Every key
    # below is now in _W11_TRAINING_KEY_MAP, so setting any of them moves BOTH arms and the
    # OMIT rationale no longer applies to any of them.
    #
    # They are still omitted here, unchanged, because seven suites depend on this base config
    # (see the TAXONOMY CORRECTION block at the top). But omission is no longer the SAFE choice
    # it was: it now leaves each arm on its own default, and #556's own commit note records
    # those defaults differing by 2x and 100x for two of these keys. Set them explicitly the
    # next time this config is used in anger.
    #
    # candidate_patience             -> juniper-cascor#514 knob; MAPPED since #556.
    #   The old note said a non-default candidate-patience comparison was "NOT AVAILABLE until
    #   _W11_TRAINING_KEY_MAP carries the key". It carries the key. The comparison IS AVAILABLE.
    #   Unset, both arms still fall to _PROJECT_MODEL_CANDIDATE_PATIENCE = 50.
    # candidate_learning_rate        -> MAPPED since #556. Unset, the two defaults are NOT known
    #   to agree: #556 records the CLI running 0.1 where the config asked 0.05.
    # convergence_threshold          -> MAPPED since #556. Same caveat: CLI ran 0.001 against a
    #   configured 1.0e-5, 100x looser.
    # candidate_convergence_threshold-> MAPPED since #556.

runtime:
  num_processes: 4
  blas_threads: 2
  # false: gates ONLY the extra F1/precision/recall/ROC-AUC forward pass
  # (api/lifecycle/manager.py:1893). train_accuracy / val_accuracy are unaffected, so the
  # headline metric survives while an extra service-side forward pass stays out of the
  # wall-clock comparison. Same reasoning as plots: [] below.
  eval_metrics_enabled: false

outputs:
  # The CLI renders no plot FILES at all, so service-side plotting would add client work to one
  # side of a wall-clock comparison.
  plots: []
  snapshot_at_end: false
  max_wall_seconds: 14400
