# E-L: a CHEAP determinism instrument for the seeded-run reproducibility defect
# (juniper-cascor#532). This is the SERVICE arm, at N=20.
#
# WHY CAP 4
# Repeated direct-CLI runs of one identical cell (same content-addressed dataset, same network
# seed 42, same thread setting, same checkout, same host) diverge mid-training -- ending up to
# 10 pp apart in validation accuracy having done up to 16% different candidate work. Divergence
# shows up inside the first two or three growth iterations, so studying it does not need a
# 25-minute cap-16 run: cap 4 reproduces the phenomenon in ~4 minutes. That turns determinism
# from something affordable once into something affordable twenty times, and repeated trials are
# the only way to say anything sound about a stochastic effect.
#
# WHY 20 CELLS AND NOT A PAIR
# The effect fires in roughly HALF of run-pairs. Two runs that agree are therefore not evidence
# of determinism, and two that differ are not evidence of a mechanism. Three claims in this
# investigation were made and withdrawn on exactly that error, including "the service is
# deterministic" -- which rested on two agreeing service runs. The service is UNTESTED, not
# immune, and this suite is what tests it: a RATE over 20 runs, not a verdict over a pair.
#
# The replicate axis is `experiment.description`, which is the only config key that is legal
# (driver EXPERIMENT_KEYS), inert (recorded on the manifest, never sent to any service), and free
# of side effects. run_suite has no replicate primitive; this is the structure chosen instead of
# improvising one. The same idea appears as `include:` entries in
# util/experiments/suites/perf/pf1-cascor-spiral-repeats.yaml.
#
# seed_policy MUST STAY `fixed`. `per_cell` rewrites both seeds to base_seed + cell.index, which
# would silently turn this 20-cell expansion into a 20-SEED SWEEP and report a false "20 distinct
# outcomes, 100% nondeterministic" -- the exact conclusion the suite exists to test. With `fixed`,
# all 20 cells share dataset seed 42 AND network seed 42 (the service network seed is
# unconditionally 42, juniper-cascor#530), so every difference between cells is the defect.
#
# stall_seconds 1200 is load-bearing: the R-6 CI gate in tests/test_experiment_suite_yamls.py
# triggers on candidate_pool_size >= 16 OR max_hidden_units >= 64, and this suite is cap 4 /
# pool 8, so NEITHER fires and CI will not catch its absence. Without it a healthy cell reports
# a false `stalled`.
#
# The direct-CLI arm is NOT run from here. It runs the cell config this suite materialises
# through util/ad-hoc/2026-08-17_h2h_thread_probe.bash, 20 times against one stack. Both arms are
# then read by util/ad-hoc/2026-08-20_determinism_nrun.py, which reports the divergence rate and
# the timing noise floor per arm.
schema_version: 1
suite:
  name: e-l-determinism-cap4
  description: "E-L: determinism probe (cap 4 / pool 8, seed 42) -- SERVICE arm, 20 replicates"
  app: cascor
  base_config: [../../../ad-hoc/2026-08-16_h2h_wide_nrot3.yaml]
  seed_policy: fixed
# per_run_timeout_seconds 3600 -> 15600, matching the three e-j suites that share this base
# config. The base pins outputs.max_wall_seconds: 14400, so the old 3600 sat far BELOW the
# driver's own budget: run_suite's subprocess kill would have fired first and recorded
# `timed_out` with exit_code null and NO manifest. Latent only — this cap-4 probe measured
# 229.0 s (20260818T032548Z) — but the DRIVER must be what stops a run, and a determinism study
# that loses its manifest loses the very record it exists to produce
# (see e-j-h2h-wide-cap64.yaml:73-75). Budget left at 14400: harness-only change, see e-k.
execution: {mode: sequential, continue_on_failure: true, per_run_timeout_seconds: 15600, stall_seconds: 1200}
matrix:
  training.params.max_hidden_units: [4]
  dataset.params.seed: [42]
  experiment.seed: [42]
  # The replicate axis. 20 inert values -> 20 cells of one identical experiment.
  experiment.description:
    - "E-L determinism -- SERVICE replicate 01 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 02 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 03 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 04 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 05 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 06 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 07 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 08 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 09 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 10 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 11 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 12 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 13 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 14 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 15 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 16 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 17 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 18 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 19 of 20, cap 4, seed 42"
    - "E-L determinism -- SERVICE replicate 20 of 20, cap 4, seed 42"
outputs: {suite_dir: null, aggregate: [csv, markdown]}
