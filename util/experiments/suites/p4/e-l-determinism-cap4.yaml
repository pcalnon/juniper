# E-L: a CHEAP determinism instrument for the CLI-vs-service reproducibility defect.
#
# WHY CAP 4
# Two direct-CLI runs of the identical cap-16 cell (same data, same network seed 42, same thread
# setting) were bit-identical through iteration 1 and diverged at iteration 2 -- ending 10 pp apart
# in validation accuracy (0.8650 vs 0.7650) having done 16% different candidate work. Two SERVICE
# runs of the same cell reproduced bit-identically. That last observation was later WITHDRAWN as a
# determinism claim: two agreeing runs is far too small a sample against an effect that diverged in
# 3 of 5 pairs, and the service arm has never been sampled at N>=20. Treat the service as UNTESTED,
# not immune (juniper-cascor#532).
#
# Divergence therefore shows up within the first handful of growth iterations, so studying it does
# not need a 25-minute cap-16 run. Cap 4 reproduces the phenomenon in ~4 minutes, which turns
# determinism from something affordable once into something affordable a dozen times -- and
# repeated trials are the only way to say anything sound about a stochastic effect.
#
# Read this suite as the SERVICE control of the pair. It exists to generate the shared cell config
# and to confirm the service's determinism at this cap; the CLI arms run the generated cell through
# util/ad-hoc/2026-08-17_h2h_thread_probe.bash at several thread budgets, twice each.
#
# seed 42 / seed_policy fixed: both arms then share dataset AND network initialisation, since the
# service network is unconditionally seed 42 (juniper-cascor#530).
schema_version: 1
suite:
  name: e-l-determinism-cap4
  description: "E-L: cheap determinism probe (cap 4 / pool 8, seed 42) for the CLI reproducibility defect"
  app: cascor
  base_config: [../../../ad-hoc/2026-08-16_h2h_wide_nrot3.yaml]
  seed_policy: fixed
# per_run_timeout_seconds 3600 -> 15600, matching the three e-j suites that share this base
# config. The base pins outputs.max_wall_seconds: 14400, so the old 3600 sat far BELOW the
# driver's own budget: run_suite's subprocess kill would have fired first and recorded
# `timed_out` with exit_code null and NO manifest. Latent only — this cap-4 probe measured
# 229.0 s (20260818T032548Z) — but the DRIVER must be what stops a run, and a determinism study
# that loses its manifest loses the very record it exists to produce
# (see e-j-h2h-wide-cap64.yaml:73-75). Budget left at 14400: harness-only change, see e-k.
execution: {mode: sequential, continue_on_failure: true, per_run_timeout_seconds: 15600, stall_seconds: 1200}
matrix:
  training.params.max_hidden_units: [4]
  dataset.params.seed: [42]
  experiment.seed: [42]
  experiment.description: ["E-L determinism probe -- SERVICE control, cap 4, seed 42"]
outputs: {suite_dir: null, aggregate: [csv, markdown]}
