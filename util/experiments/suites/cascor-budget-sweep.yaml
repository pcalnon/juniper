# E-A reference suite (CLI experimentation plan §10.5 / §13.1): cascade budget × candidate pool
# on spiral. Cells = base_config × matrix, minus exclude, plus include. Run with:
#   python util/experiments/run_suite.py --suite util/experiments/suites/cascor-budget-sweep.yaml --dry-run
schema_version: 1
suite:
  name: cascor-budget-sweep
  description: "E-A: cascade budget x candidate pool on spiral"
  app: cascor
  base_config:
    - ../../../../juniper-cascor/conf/experiments/spiral-baseline.yaml
  seed_policy: fixed
execution:
  mode: sequential
  max_parallel: 1
  continue_on_failure: true
  per_run_timeout_seconds: 3600
  # The Q-2 stall detector watches current_epoch, which advances only during OUTPUT-layer
  # training — nothing is reported while the CANDIDATE pool trains. Every pool >= 16 cell
  # therefore reads as `stalled` at ~130 s against the 120 s driver default while healthy;
  # given room they complete in 513-2494 s. 1200 is the window proven on the P4 E-A re-run,
  # of which this suite is the reference form. (ml#1069)
  stall_seconds: 1200
matrix:
  training.params.max_hidden_units: [4, 8, 16, 32]
  training.params.candidate_pool_size: [4, 8, 16]
include:
  - name: wide-pool-long
    overrides:
      training.params.candidate_pool_size: 32
      training.params.max_epochs: 5000
exclude:
  - {training.params.max_hidden_units: 32, training.params.candidate_pool_size: 16}
outputs:
  suite_dir: null
  aggregate: [csv, markdown]
